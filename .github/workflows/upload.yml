name: Upload to Registry
on:
  push:
    branches:
      - master
    paths:
      - 'recipes/**/biochef.yaml'

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      biochef_files: ${{ steps.detect_files.outputs.biochef_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed biochef.yaml files
        id: detect_files
        run: |
          echo "Listing changed files..."

          CHANGED=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})

          FILES=$(echo "$CHANGED" | grep "biochef.yaml" | paste -sd " " - || true)

          if [ -z "$FILES" ]; then
            echo "No recipe changes detected"
            exit 1
          fi

          echo "Changed biochef.yaml files:"
          echo "$FILES"

          echo "biochef_files=$FILES" >> $GITHUB_OUTPUT

  publish_recipes:
    needs: detect_changes
    uses: ieeta-pt/biochef-hub/.github/workflows/publish-recipes.yml@master
    with:
      registry_url: ${{ vars.REGISTRY_URL }}
      recipes: ${{ needs.detect_changes.outputs.biochef_files }}
      oras_auth: ${{ vars.ORAS_AUTH_METHOD }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
