apiVersion: v1

id: app.biochef.ssw
name: ssw
description: SSW (Striped Smith-Waterman), a SIMD implementation of Smith-Waterman local alignment. Aligns each query sequence against each target sequence (DNA or protein) and reports the score, the alignment location and optionally the alignment path, as text or SAM.

version: 1.2.5-bc.1
homepage: https://github.com/mengyao/Complete-Striped-Smith-Waterman-Library
license:
  spdx: MIT AND BSD-2-Clause
  files: [README.md]
  evidence_files: [src/ssw.c]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/mengyao/Complete-Striped-Smith-Waterman-Library
  version: "1.2.5"
  commit: "c32f4c2b07df137a0fce72ec7c7e60474937a52e"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      outputDir: out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    buildTools: [make, gcc]
    outputDir: bin

runtime:
  modes: [wasm, native, remote]

operations:
  - id: ssw.align
    name: Align (SSW)
    category: Genomic Operations
    bin: ssw
    description: Local pairwise alignment of each query sequence against each target sequence (DNA, or protein with BLOSUM50). Outputs the alignment score, location and, with the path option, the alignment.
    io:
      inputs:
        - { name: target, types: [FASTA, Multi-FASTA], mode: file }
        - { name: query, types: [FASTA, Multi-FASTA, FASTQ], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: match, type: integer, flag: -m, default: 2 }
      - { name: mismatch, type: integer, flag: -x, default: 2 }
      - { name: gap_open, type: integer, flag: -o, default: 3 }
      - { name: gap_extend, type: integer, flag: -e, default: 1 }
      - { name: protein, type: flag, flag: -p }
      - { name: cigar, type: flag, flag: -c }
      - { name: min_score, type: integer, flag: -f }
      - { name: reverse_complement, type: flag, flag: -r }

  - id: ssw.align.sam
    name: Align to SAM (SSW)
    category: Genomic Operations
    bin: ssw
    description: Local pairwise alignment of each query sequence against each target sequence (DNA, or protein with BLOSUM50), written as SAM with a header.
    io:
      inputs:
        - { name: target, types: [FASTA, Multi-FASTA], mode: file }
        - { name: query, types: [FASTA, Multi-FASTA, FASTQ], mode: file }
      outputs:
        - { name: out, types: [SAM], mode: stdout }
    parameters:
      - { name: cigar, type: flag, flag: -c, required: true, hidden: true }
      - { name: sam_output, type: flag, flag: -s, required: true, hidden: true }
      - { name: sam_header, type: flag, flag: -h, required: true, hidden: true }
      - { name: match, type: integer, flag: -m, default: 2 }
      - { name: mismatch, type: integer, flag: -x, default: 2 }
      - { name: gap_open, type: integer, flag: -o, default: 3 }
      - { name: gap_extend, type: integer, flag: -e, default: 1 }
      - { name: protein, type: flag, flag: -p }
      - { name: min_score, type: integer, flag: -f }
      - { name: reverse_complement, type: flag, flag: -r }

  - id: ssw.align.matrix
    name: Align with Matrix (SSW)
    category: Genomic Operations
    bin: ssw
    description: Local pairwise alignment of protein sequences with a substitution matrix file in BLOSUM or PAM format. Outputs the alignment score, location and, with the path option, the alignment.
    io:
      inputs:
        - { name: matrix, types: [SCORING_MATRIX], mode: file, flag: -a }
        - { name: target, types: [FASTA, Multi-FASTA], mode: file }
        - { name: query, types: [FASTA, Multi-FASTA, FASTQ], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: gap_open, type: integer, flag: -o, default: 3 }
      - { name: gap_extend, type: integer, flag: -e, default: 1 }
      - { name: cigar, type: flag, flag: -c }
      - { name: min_score, type: integer, flag: -f }

  - id: ssw.align.matrix.sam
    name: Align with Matrix to SAM (SSW)
    category: Genomic Operations
    bin: ssw
    description: Local pairwise alignment of protein sequences with a substitution matrix file in BLOSUM or PAM format, written as SAM with a header.
    io:
      inputs:
        - { name: matrix, types: [SCORING_MATRIX], mode: file, flag: -a }
        - { name: target, types: [FASTA, Multi-FASTA], mode: file }
        - { name: query, types: [FASTA, Multi-FASTA, FASTQ], mode: file }
      outputs:
        - { name: out, types: [SAM], mode: stdout }
    parameters:
      - { name: cigar, type: flag, flag: -c, required: true, hidden: true }
      - { name: sam_output, type: flag, flag: -s, required: true, hidden: true }
      - { name: sam_header, type: flag, flag: -h, required: true, hidden: true }
      - { name: gap_open, type: integer, flag: -o, default: 3 }
      - { name: gap_extend, type: integer, flag: -e, default: 1 }
      - { name: min_score, type: integer, flag: -f }
