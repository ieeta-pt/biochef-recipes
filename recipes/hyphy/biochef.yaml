apiVersion: v1

id: app.biochef.hyphy
name: hyphy
description: Comparative sequence analysis using stochastic evolutionary models. Tests for selection (BUSTED, MEME, FEL, aBSREL) on codon alignments given a phylogeny.

version: 2.5.57-bc.1
homepage: https://github.com/veg/hyphy
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/veg/hyphy
  tag: "2.5.57"
  version: "2.5.57"
  commit: "c1f1ca1ce0123bc7e20fac39810a7aa8ba26377b"

status: experimental

build:
  wasm:
    strategy: biowasm
    biowasm:
      package: hyphy

runtime:
  modes: [wasm]

# Every analysis needs an in-frame codon alignment (length a multiple of 3, no
# stop codons) and a Newick tree whose leaf names match the sequence names.
# hyphy writes the reason for a rejected input to errors.log, not to stderr, so
# a bad input only shows up as "program exited (with status: 1)".
#
# Options are the analysis' own keyword arguments (res/TemplateBatchFiles/
# SelectionAnalyses/<method>.bf at the tag); defaults are hyphy's.

operations:
  - id: hyphy.busted
    name: BUSTED (HyPhy)
    category: Genomic Operations
    bin: hyphy
    description: Branch-Site Unrestricted Statistical Test for Episodic Diversification — gene-wide test for episodic positive selection on a (subset of) phylogenetic branches. Needs an in-frame codon alignment without stop codons and a Newick tree with matching names.
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --alignment }
        - { name: tree, types: [TEXT], mode: file, flag: --tree }
      outputs:
        - { name: out, types: [JSON], mode: file, flag: --output }
    parameters:
      - { name: command, type: string, default: BUSTED, required: true, hidden: true }
      - { name: code, type: string, flag: --code, default: Universal }
      - { name: branches, type: string, flag: --branches, default: All }
      - { name: srv, type: string, flag: --srv, default: "Yes" }
      - { name: syn_rates, type: integer, flag: --syn-rates, default: 3 }
      - { name: multiple_hits, type: string, flag: --multiple-hits, default: None }
      - { name: starting_points, type: integer, flag: --starting-points, default: 1 }

  - id: hyphy.meme
    name: MEME (HyPhy)
    category: Genomic Operations
    bin: hyphy
    description: Mixed Effects Model of Evolution — per-site test for episodic positive selection. Needs an in-frame codon alignment without stop codons and a Newick tree with matching names.
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --alignment }
        - { name: tree, types: [TEXT], mode: file, flag: --tree }
      outputs:
        - { name: out, types: [JSON], mode: file, flag: --output }
    parameters:
      - { name: command, type: string, default: MEME, required: true, hidden: true }
      - { name: code, type: string, flag: --code, default: Universal }
      - { name: branches, type: string, flag: --branches, default: All }
      - { name: pvalue, type: float, flag: --pvalue, default: 0.1 }
      - { name: multiple_hits, type: string, flag: --multiple-hits, default: None }
      - { name: resample, type: integer, flag: --resample, default: 0 }

  - id: hyphy.fel
    name: FEL (HyPhy)
    category: Genomic Operations
    bin: hyphy
    description: Fixed Effects Likelihood — per-site frequentist test for pervasive selection (dN/dS != 1). Needs an in-frame codon alignment without stop codons and a Newick tree with matching names.
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --alignment }
        - { name: tree, types: [TEXT], mode: file, flag: --tree }
      outputs:
        - { name: out, types: [JSON], mode: file, flag: --output }
    parameters:
      - { name: command, type: string, default: FEL, required: true, hidden: true }
      - { name: code, type: string, flag: --code, default: Universal }
      - { name: branches, type: string, flag: --branches, default: All }
      - { name: pvalue, type: float, flag: --pvalue, default: 0.1 }
      - { name: srv, type: string, flag: --srv, default: "Yes" }
      - { name: multiple_hits, type: string, flag: --multiple-hits, default: None }
      - { name: ci, type: string, flag: --ci, default: "No" }
      - { name: resample, type: integer, flag: --resample, default: 0 }

  - id: hyphy.absrel
    name: aBSREL (HyPhy)
    category: Genomic Operations
    bin: hyphy
    description: Adaptive Branch-Site Random Effects Likelihood — branch-site test for episodic diversification, allowing per-branch rate categories. Needs an in-frame codon alignment without stop codons and a Newick tree with matching names.
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --alignment }
        - { name: tree, types: [TEXT], mode: file, flag: --tree }
      outputs:
        - { name: out, types: [JSON], mode: file, flag: --output }
    parameters:
      - { name: command, type: string, default: aBSREL, required: true, hidden: true }
      - { name: code, type: string, flag: --code, default: Universal }
      - { name: branches, type: string, flag: --branches, default: All }
      - { name: srv, type: string, flag: --srv, default: "No" }
      - { name: multiple_hits, type: string, flag: --multiple-hits, default: None }
