apiVersion: v1

id: app.biochef.vcfx
name: VCFX
description: Comprehensive VCF manipulation toolkit (60 specialized tools) from IEETA. Each tool reads from stdin and writes to stdout, pipeline-friendly.

version: 1.1.5-bc.1
homepage: https://github.com/ieeta-pt/VCFX
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/ieeta-pt/VCFX
  tag: "v1.1.5"
  version: "1.1.5"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      buildsystem: make
      workDir: .
      outputDir: build_wasm
      commands:
        - 'bash compile_wasm.sh'
        - 'find build_wasm/src -name "*.js" -exec cp {} build_wasm/ \;'
        - 'find build_wasm/src -name "*.wasm" -exec cp {} build_wasm/ \;'
        - "echo 'all:' > Makefile"
      env: []
  native:
    buildsystem: make
    workDir: .
    outputDir: bin

runtime:
  modes: [wasm, native, remote]

operations:

  - id: vcfx.af.subsetter
    name: Af Subsetter (VCFX)
    category: Variant Analysis
    bin: VCFX_af_subsetter
    description: VCFX af subsetter tool.
    io:
      inputs:
        - { name: in, types: [VCF], mode: stdin }
      outputs:
        - { name: out, types: ['VCF'], mode: stdout }
    parameters: []

  - id: vcfx.alignment.checker
    name: Alignment Checker (VCFX)
