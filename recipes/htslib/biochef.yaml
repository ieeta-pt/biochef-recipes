apiVersion: v1

id: app.biochef.htslib
name: htslib
description: HTSlib utilities, namely bgzip (BGZF compression), tabix (indexing tab-delimited files) and htsfile (identifying file formats).

version: 1.21-bc.1
homepage: https://github.com/samtools/htslib
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/samtools/htslib
  tag: "1.21"
  version: "1.21"
  commit: "0f8bedc11e3ee039060a058b5cd5ec99e0b593a2"

status: experimental

build:
  wasm:
    strategy: biowasm
    biowasm:
      package: htslib

runtime:
  modes: [wasm, remote]

operations:
  - id: htslib.bgzip
    name: BGZip (compress)
    category: Format Conversion
    bin: bgzip
    description: BGZF-compress a text file, such as BED, GFF or SAM. VCF has its own operation, whose output is typed.
    io:
      inputs:
        - { name: in, types: [TEXT, BED, GFF, SAM], mode: file }
      outputs:
        - { name: out, types: [BGZF], mode: file, flag: -o, filename: out.gz }
    parameters:
      - { name: keep_input, type: flag, flag: -k }
      - { name: force, type: flag, flag: -f }
      - { name: index, type: flag, flag: -i }
      - { name: index_name, type: string, flag: -I }
      - { name: compress_level, type: integer, flag: -l }
      - { name: binary, type: flag, flag: --binary }
      - { name: threads, type: integer, flag: --threads, default: 1 }

  - id: htslib.bgzip.vcf
    name: BGZip VCF (compress)
    category: Format Conversion
    bin: bgzip
    description: BGZF-compress a VCF or gVCF, which makes it indexable with tabix or bcftools index.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: file }
      outputs:
        - { name: out, types: [VCF_GZ, GVCF_GZ], mode: file, flag: -o, filename: out.vcf.gz }
    parameters:
      - { name: compress_level, type: integer, flag: -l }
      - { name: threads, type: integer, flag: --threads, default: 1 }

  - id: htslib.bgzip.decompress
    name: BGZip (decompress)
    category: Format Conversion
    bin: bgzip
    description: Decompress a BGZF file to stdout
    io:
      inputs:
        - { name: in, types: [VCF_GZ, GVCF_GZ, BGZF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, TEXT], mode: stdout }
    parameters:
      - { name: decompress, type: flag, flag: -d, required: true, hidden: true }
      - { name: stdout, type: flag, flag: -c, required: true, hidden: true }
      - { name: keep_input, type: flag, flag: -k }
      - { name: force, type: flag, flag: -f }
      - { name: offset, type: integer, flag: -b }
      - { name: size, type: integer, flag: -s }
      - { name: test_integrity, type: flag, flag: -t }
      - { name: threads, type: integer, flag: --threads, default: 1 }

  - id: htslib.tabix.index
    name: Tabix Index
    category: Genomic Operations
    bin: tabix
    description: Index a bgzipped tab-delimited file, such as a VCF.gz, as TBI (or CSI with the csi option). tabix writes the index next to its input, named after it.
    io:
      inputs:
        - { name: in, types: [VCF_GZ, GVCF_GZ, BGZF], mode: file }
      outputs:
        - { name: out, types: [TBI, CSI], mode: file, filename: "in.txt.tbi" }
    parameters:
      - { name: preset, type: string, flag: -p }
      - { name: zero_based, type: flag, flag: "-0" }
      - { name: sequence_col, type: integer, flag: -s }
      - { name: begin_col, type: integer, flag: -b }
      - { name: end_col, type: integer, flag: -e }
      - { name: comment_char, type: string, flag: -c }
      - { name: skip_lines, type: integer, flag: -S }
      - { name: csi, type: flag, flag: -C }
      - { name: min_shift, type: integer, flag: -m }
      - { name: force, type: flag, flag: -f }
      - { name: threads, type: integer, flag: --threads, default: 1 }

  - id: htslib.htsfile
    name: HTS File (identify)
    category: Information and Analysis
    bin: htsfile
    description: Identify the format of an HTS-related file (FASTA, SAM, BAM, CRAM, VCF, BCF and their indexes)
    io:
      inputs:
        - { name: in, types: [TEXT, BIN, FASTA, FASTQ, VCF, GVCF, VCF_GZ, GVCF_GZ, BGZF, BCF, TBI, CSI, SAM, BAM, BAI, CRAM, BED, GFF], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: view, type: flag, flag: -c }
      - { name: header_only, type: flag, flag: -h }
      - { name: no_header, type: flag, flag: -H }
      - { name: verbose, type: flag, flag: -v }
