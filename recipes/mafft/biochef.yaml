      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }

  - id: mafft.addfull.distances
    name: "Add Full-Length Sequences, Step 1 of 3: Distances (MAFFT)"
    category: Sequence Analysis
    bin: dndpre
    description: "First step of mafft --addfull: distances between the sequences of the alignment."
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
        - { name: new_sequences, types: [FASTA, Multi-FASTA], mode: file, flag: --bc-add }
      outputs:
        - { name: distances, types: [MAFFT_HAT2], mode: file, filename: "hat2" }
    parameters:
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_m_upper, type: string, flag: -M, default: "2", required: true, hidden: true }
      - { name: fixed_k_upper, type: flag, flag: -K, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b_2, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "-0.100", required: true, hidden: true }
      - { name: fixed_f, type: string, flag: -f, default: "-2.00", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0.1", required: true, hidden: true }
      - { name: output_hat2, type: string, flag: --bc-output, default: "hat2", required: true, hidden: true }

  - id: mafft.addfull.local
    name: "Add Full-Length Sequences, Step 2 of 3: Local Alignments (MAFFT)"
    category: Sequence Analysis
    bin: pairlocalalign
    description: "Second step of mafft --addfull: local alignments of the new sequences against the alignment, and the distances between all of them."
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
        - { name: new_sequences, types: [FASTA, Multi-FASTA], mode: file, flag: --bc-add }
      outputs:
        - { name: distances, types: [MAFFT_HAT2], mode: file, filename: "hat2" }
        - { name: local_alignments, types: [MAFFT_HAT3], mode: file, filename: "hat3" }
    parameters:
      - { name: fixed_l, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_k_upper, type: flag, flag: -K, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "-0.100", required: true, hidden: true }
      - { name: fixed_f, type: string, flag: -f, default: "-2.00", required: true, hidden: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0.1", required: true, hidden: true }
      - { name: fixed_y_upper, type: flag, flag: -Y, required: true, hidden: true }
      - { name: output_hat2, type: string, flag: --bc-output, default: "hat2", required: true, hidden: true }
      - { name: output_hat3, type: string, flag: --bc-output, default: "hat3", required: true, hidden: true }

  - id: mafft.addfull
    name: Add Full-Length Sequences, Step 3 of 3 (MAFFT)
    category: Sequence Analysis
    bin: addsingle
    description: "Last step of mafft --addfull: adds full-length sequences to the alignment, using the distances from Step 1 (alignment_distances), and the distances and local alignments from Step 2 (all_distances, local_alignments). All must come from the same alignment and new sequences."
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
        - { name: new_sequences, types: [FASTA, Multi-FASTA], mode: file, flag: --bc-add }
        - { name: alignment_distances, types: [MAFFT_HAT2], mode: file, flag: --bc-hat2i }
        - { name: all_distances, types: [MAFFT_HAT2], mode: file, flag: --bc-hat2n }
        - { name: local_alignments, types: [MAFFT_HAT3], mode: file, flag: --bc-hat3 }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, filename: "pre" }
    parameters:
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100", required: true, hidden: true }
      - { name: fixed_d, type: flag, flag: -d, required: true, hidden: true }
      - { name: fixed_o_upper, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_v_upper, type: flag, flag: -V, required: true, hidden: true }
      - { name: fixed_k_upper, type: flag, flag: -K, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_l, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }

  - id: mafft.profile
    name: Profile-Profile Alignment (MAFFT)
    category: Sequence Analysis
    bin: mafft-profile
    description: Align two alignments to each other (group-to-group), keeping the columns within each. Both inputs must already be aligned.
    io:
      inputs:
        - { name: alignment1, types: [Multi-FASTA, FASTA], mode: file }
        - { name: alignment2, types: [Multi-FASTA, FASTA], mode: file }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
    parameters: []

  - id: mafft.distance
    name: Distance Matrix (MAFFT)
    category: Sequence Analysis
    bin: mafft-distance
    description: Distances between all pairs of unaligned sequences, from shared 6-mers, one pair per line as "i-j d=distance l=length_i,length_j".
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: -i }
      outputs:
        - { name: distances, types: [MAFFT_DIST], mode: stdout }
    parameters: []

  - id: mafft.f2cl
    name: FASTA to CLUSTAL (MAFFT)
    category: Format Conversion
    bin: f2cl
    description: Convert an alignment to CLUSTAL format, as mafft --clustalout does. method is the name written in the CLUSTAL header.
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: clustal, types: [CLUSTAL], mode: stdout }
    parameters:
      - { name: fixed_n, type: string, flag: -n, default: "-1", required: true, hidden: true }
      - { name: method, type: string, flag: -c, default: "FFT-NS-2", required: true }
      - { name: fixed_n_upper, type: flag, flag: -N, required: true, hidden: true }
