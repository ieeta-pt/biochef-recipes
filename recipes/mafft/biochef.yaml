  - id: mafft.parttree
    name: Align with PartTree, Step 1 of 2 (MAFFT)
    category: Sequence Analysis
    bin: splittbfast
    description: "First step of PartTree (mafft --parttree), for tens of thousands of sequences: a guide tree from a few sequences instead of all pairs. Finish it with Align with PartTree, Step 2, given this alignment."
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: -i }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
    parameters:
      - { name: fixed_x, type: flag, flag: -x, required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_p, type: string, flag: -p, default: "50", required: true, hidden: true }
      - { name: fixed_s, type: string, flag: -s, default: "-1", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }

  - id: mafft.parttree.step2
    name: Align with PartTree, Step 2 of 2 (MAFFT)
    category: Sequence Analysis
    bin: splittbfast
    description: "Second step of PartTree (mafft --parttree): realigns the alignment from Step 1 along a guide tree built from it."
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: -i }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
