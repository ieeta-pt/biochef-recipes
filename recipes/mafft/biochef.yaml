    description: Add new sequences to an existing alignment (mafft --add), aligning them with FFT-NS-2. With keep_length (--keeplength), the columns of the alignment are kept and insertions in the new sequences are deleted.
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
