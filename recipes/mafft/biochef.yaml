apiVersion: v1

id: app.biochef.mafft
name: MAFFT
description: "MAFFT multiple sequence alignment. The mafft script, which picks a strategy and chains its programs, does not run in the browser, so each strategy is an operation here, running the program the script runs with the arguments it gives it. Strategies the script runs in several programs are several operations, chained in a workflow: L-INS-i, G-INS-i or E-INS-i then Refine (INS-i); FFT-NS-2 or NW-NS-2, Distances for Refinement and Refine (FFT-NS-i) for FFT-NS-i and NW-NS-i; the two PartTree steps; and the three steps of adding fragments, long or full-length sequences. Each operation gives the same result as mafft 7.471."

version: 7.471-bc.1
homepage: https://mafft.cbrc.jp/alignment/software/
license:
  spdx: BSD-3-Clause
  files: [license]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/GSLBiotech/mafft
  tag: "7.471-without-extensions-msvc"
  version: "7.471"
  commit: "26ecaba0130b533cf06a29200f0fb40829c00101"

status: experimental

build:
  wasm:
    strategy: emscripten
    patches: [patches/biochef-entry-point.patch]
    emscripten:
      outputDir: core/out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh

runtime:
  modes: [wasm]

operations:
  - id: mafft.fftns2
    name: Align with FFT-NS-2 (MAFFT)
    category: Sequence Analysis
    bin: disttbfast
    description: Fast progressive alignment with two rounds of guide tree building, the default of MAFFT, as mafft runs it. For FFT-NS-i or NW-NS-i, follow it with Distances for Refinement and Refine (FFT-NS-i).
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
    parameters:
      - { name: fixed_q, type: string, flag: -q, default: "0", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "2", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "6", required: true, hidden: true }
      - { name: fixed_o_upper, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0-0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "0", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: fixed_x, type: string, flag: -x, default: "1000", required: true, hidden: true }

  - id: mafft.fftns1
    name: Align with FFT-NS-1 (MAFFT)
    category: Sequence Analysis
    bin: disttbfast
    description: Very fast progressive alignment with one round of guide tree building, as mafft --retree 1 runs it. For FFT-NS-i or NW-NS-i, follow it with Distances for Refinement and Refine (FFT-NS-i).
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
    parameters:
      - { name: fixed_q, type: string, flag: -q, default: "0", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "1", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "6", required: true, hidden: true }
      - { name: fixed_o_upper, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0-0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "0", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: fixed_x, type: string, flag: -x, default: "1000", required: true, hidden: true }

  - id: mafft.nwns2
    name: Align with NW-NS-2 (MAFFT)
    category: Sequence Analysis
    bin: disttbfast
    description: Progressive alignment like FFT-NS-2, without the FFT approximation, as mafft --nofft runs it. For FFT-NS-i or NW-NS-i, follow it with Distances for Refinement and Refine (FFT-NS-i).
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
    parameters:
      - { name: fixed_q, type: string, flag: -q, default: "0", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "2", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "6", required: true, hidden: true }
      - { name: fixed_o_upper, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0-0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "0", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: fixed_x, type: string, flag: -x, default: "1000", required: true, hidden: true }

  - id: mafft.nwns1
    name: Align with NW-NS-1 (MAFFT)
    category: Sequence Analysis
    bin: disttbfast
    description: Progressive alignment like FFT-NS-1, without the FFT approximation, as mafft --nofft --retree 1 runs it. For FFT-NS-i or NW-NS-i, follow it with Distances for Refinement and Refine (FFT-NS-i).
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: stdout }
    parameters:
      - { name: fixed_q, type: string, flag: -q, default: "0", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "1", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "6", required: true, hidden: true }
      - { name: fixed_o_upper, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0-0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "0", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: fixed_x, type: string, flag: -x, default: "1000", required: true, hidden: true }

  - id: mafft.linsi
    name: Align with L-INS-i, Step 1 of 2 (MAFFT)
    category: Sequence Analysis
    bin: tbfast
    description: "First step of L-INS-i (mafft --localpair --maxiterate 1000): progressive alignment with iterative refinement, guided by local pairwise alignments with affine gap costs; the most accurate for sequences with one alignable domain. Finish it with Refine (INS-i), giving it this step's alignment, distances and local alignments."
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, filename: "pre" }
        - { name: distances, types: [MAFFT_HAT2], mode: file, filename: "hat2" }
        - { name: local_alignments, types: [MAFFT_HAT3], mode: file, filename: "hat3" }
    parameters:
      - { name: pairwise_options, type: string, default: "_", required: true, hidden: true }
      - { name: fixed_u, type: string, flag: -u, default: "0.0", required: true, hidden: true }
      - { name: fixed_l, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "-0.100", required: true, hidden: true }
      - { name: fixed_f, type: string, flag: -f, default: "-2.00", required: true, hidden: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0.1", required: true, hidden: true }
      - { name: fixed_l_upper, type: flag, flag: -L, required: true, hidden: true }
      - { name: pairwise_options_2, type: string, default: "_", required: true, hidden: true }
      - { name: max_iterations, type: integer, flag: -+, default: 16, required: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "0.00001", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_o_upper, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_c_upper_2, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b_2, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper_2, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h_2, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_l_2, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: output_hat2, type: string, flag: --bc-output, default: "hat2", required: true, hidden: true }
      - { name: output_hat3, type: string, flag: --bc-output, default: "hat3", required: true, hidden: true }

  - id: mafft.ginsi
    name: Align with G-INS-i, Step 1 of 2 (MAFFT)
    category: Sequence Analysis
    bin: tbfast
    description: "First step of G-INS-i (mafft --globalpair --maxiterate 1000): progressive alignment with iterative refinement, guided by global pairwise alignments; for sequences of similar length that align over their whole length. Finish it with Refine (INS-i), giving it this step's alignment, distances and local alignments."
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, filename: "pre" }
        - { name: distances, types: [MAFFT_HAT2], mode: file, filename: "hat2" }
        - { name: local_alignments, types: [MAFFT_HAT3], mode: file, filename: "hat3" }
    parameters:
      - { name: pairwise_options, type: string, default: "_", required: true, hidden: true }
      - { name: fixed_u, type: string, flag: -u, default: "0.0", required: true, hidden: true }
      - { name: fixed_l, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "-0.10", required: true, hidden: true }
      - { name: fixed_f, type: string, flag: -f, default: "-2.00", required: true, hidden: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0.1", required: true, hidden: true }
      - { name: fixed_a_upper, type: flag, flag: -A, required: true, hidden: true }
      - { name: pairwise_options_2, type: string, default: "_", required: true, hidden: true }
      - { name: max_iterations, type: integer, flag: -+, default: 16, required: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "0.00001", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_c_upper_2, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b_2, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper_2, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h_2, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_l_2, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: output_hat2, type: string, flag: --bc-output, default: "hat2", required: true, hidden: true }
      - { name: output_hat3, type: string, flag: --bc-output, default: "hat3", required: true, hidden: true }

  - id: mafft.einsi
    name: Align with E-INS-i, Step 1 of 2 (MAFFT)
    category: Sequence Analysis
    bin: tbfast
    description: "First step of E-INS-i (mafft --genafpair --maxiterate 1000): progressive alignment with iterative refinement, guided by local pairwise alignments with generalized affine gap costs; for sequences with several conserved domains in long unalignable regions. Finish it with Refine (INS-i), giving it this step's alignment, distances and local alignments."
    io:
      inputs:
        - { name: sequences, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, filename: "pre" }
        - { name: distances, types: [MAFFT_HAT2], mode: file, filename: "hat2" }
        - { name: local_alignments, types: [MAFFT_HAT3], mode: file, filename: "hat3" }
    parameters:
      - { name: pairwise_options, type: string, default: "_", required: true, hidden: true }
      - { name: fixed_u, type: string, flag: -u, default: "0.0", required: true, hidden: true }
      - { name: fixed_l, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_g, type: string, flag: -g, default: "0.0", required: true, hidden: true }
      - { name: fixed_f, type: string, flag: -f, default: "-2.00", required: true, hidden: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0.0", required: true, hidden: true }
      - { name: fixed_o_upper, type: string, flag: -O, default: "-6.00", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "-0.000", required: true, hidden: true }
      - { name: fixed_n_upper, type: flag, flag: -N, required: true, hidden: true }
      - { name: fixed_z_upper, type: flag, flag: -Z, required: true, hidden: true }
      - { name: pairwise_options_2, type: string, default: "_", required: true, hidden: true }
      - { name: max_iterations, type: integer, flag: -+, default: 16, required: true }
      - { name: fixed_w_upper, type: string, flag: -W, default: "0.00001", required: true, hidden: true }
      - { name: gap_opening_distances, type: float, flag: -V, default: -1.53, required: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_o_upper_2, type: flag, flag: -O, required: true, hidden: true }
      - { name: fixed_c_upper_2, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_b_2, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper_2, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h_2, type: string, flag: -h, default: "0.000", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_l_2, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: output_hat2, type: string, flag: --bc-output, default: "hat2", required: true, hidden: true }
      - { name: output_hat3, type: string, flag: --bc-output, default: "hat3", required: true, hidden: true }

  - id: mafft.refine.insi
    name: Refine (INS-i), Step 2 of 2 (MAFFT)
    category: Sequence Analysis
    bin: dvtditr
    description: "Second step of L-INS-i, G-INS-i and E-INS-i: iterative refinement of the alignment from Step 1, using the distances and local alignments that step wrote. The distances and local alignments must come from the same run as the alignment."
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
        - { name: distances, types: [MAFFT_HAT2], mode: file, flag: --bc-hat2 }
        - { name: local_alignments, types: [MAFFT_HAT3], mode: file, flag: --bc-hat3 }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, filename: "pre" }
    parameters:
      - { name: fixed_w_upper, type: string, flag: -W, default: "0.00001", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "0.0", required: true, hidden: true }
      - { name: fixed_s, type: string, flag: -s, default: "0.0", required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: fixed_t, type: string, flag: -t, default: "0", required: true, hidden: true }
      - { name: fixed_f_upper, type: flag, flag: -F, required: true, hidden: true }
      - { name: fixed_l, type: string, flag: -l, default: "2.7", required: true, hidden: true }
      - { name: fixed_z, type: string, flag: -z, default: "50", required: true, hidden: true }
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: gap_opening, type: float, flag: -f, default: -1.53, required: true }
      - { name: fixed_q_upper, type: string, flag: -Q, default: "100.0", required: true, hidden: true }
      - { name: fixed_h, type: string, flag: -h, default: "0", required: true, hidden: true }
      - { name: max_iterations, type: integer, flag: -I, default: 16, required: true }
      - { name: fixed_x_upper, type: string, flag: -X, default: "0.1", required: true, hidden: true }
      - { name: fixed_p, type: string, flag: -p, default: "BAATARI2", required: true, hidden: true }
      - { name: fixed_k_upper, type: string, flag: -K, default: "0", required: true, hidden: true }

  - id: mafft.refine.distances
    name: Distances for Refinement (MAFFT)
    category: Sequence Analysis
    bin: dndpre
    description: Distances between the sequences of an alignment from FFT-NS-2 or NW-NS-2, which Refine (FFT-NS-i) needs. Together they make FFT-NS-i (mafft --maxiterate 1000) or NW-NS-i (mafft --nofft --maxiterate 2, with 2 iterations).
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
      outputs:
        - { name: distances, types: [MAFFT_HAT2], mode: file, filename: "hat2" }
    parameters:
      - { name: fixed_b, type: string, flag: -b, default: "62", required: true, hidden: true }
      - { name: fixed_m_upper, type: string, flag: -M, default: "2", required: true, hidden: true }
      - { name: fixed_c_upper, type: string, flag: -C, default: "0", required: true, hidden: true }
      - { name: output_hat2, type: string, flag: --bc-output, default: "hat2", required: true, hidden: true }

  - id: mafft.refine.fftnsi
    name: Refine (FFT-NS-i) (MAFFT)
    category: Sequence Analysis
    bin: dvtditr
    description: Iterative refinement of an alignment from FFT-NS-2 or NW-NS-2, using the distances from Distances for Refinement on that alignment. This is the last step of FFT-NS-i (16 iterations) and NW-NS-i (2 iterations).
    io:
      inputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, flag: --bc-in }
        - { name: distances, types: [MAFFT_HAT2], mode: file, flag: --bc-hat2 }
      outputs:
        - { name: alignment, types: [Multi-FASTA, FASTA], mode: file, filename: "pre" }
    parameters:
      - { name: fixed_w_upper, type: string, flag: -W, default: "0.00001", required: true, hidden: true }
      - { name: fixed_e_upper, type: string, flag: -E, default: "0.0", required: true, hidden: true }
