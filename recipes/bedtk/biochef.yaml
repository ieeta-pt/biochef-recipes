apiVersion: v1

id: app.biochef.bedtk
name: bedtk
description: bedtk, a lightweight BED interval toolkit by Heng Li. Implements intersect, subtract, merge, sort, filter, coverage and total length operations on BED files. Effectively a focused subset of bedtools, with minimal dependencies.

version: 1.2-bc.1
homepage: https://github.com/lh3/bedtk
license:
  spdx: MIT
  files: [LICENSE.txt]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/lh3/bedtk
  commit: "fa2cc15a8ab61d28bf6a4cfd50f36f883021a385"
  version: "1.2"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    buildTools: [make]

runtime:
  modes: [wasm, native]

operations:
  - id: bedtk.isec
    name: Intersect (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Intersection between two BED files (equivalent to bedtools intersect).
    io:
      inputs:
        - { name: a, types: [BED], mode: file }
        - { name: b, types: [BED], mode: file }
      outputs:
        - { name: out, types: [BED], mode: stdout }
    parameters:
      - { name: command, type: string, default: isec, required: true, hidden: true }

  - id: bedtk.sub
    name: Subtract (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Subtract regions in B from regions in A.
    io:
      inputs:
        - { name: a, types: [BED], mode: file }
        - { name: b, types: [BED], mode: file }
      outputs:
        - { name: out, types: [BED], mode: stdout }
    parameters:
      - { name: command, type: string, default: sub, required: true, hidden: true }

  - id: bedtk.merge
    name: Merge (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Merge overlapping or adjacent intervals in a BED file. Input must be sorted.
    io:
      inputs:
        - { name: in, types: [BED], mode: file }
      outputs:
        - { name: out, types: [BED], mode: stdout }
    parameters:
      - { name: command, type: string, default: merge, required: true, hidden: true }

  - id: bedtk.sort
    name: Sort (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Sort BED intervals lexicographically by chromosome and by start position.
    io:
      inputs:
        - { name: in, types: [BED], mode: file }
      outputs:
        - { name: out, types: [BED], mode: stdout }
    parameters:
      - { name: command, type: string, default: sort, required: true, hidden: true }

  - id: bedtk.flt
    name: Filter (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Keep the records of a BED that overlap a BED of regions, or with invert those that do not.
    io:
      inputs:
        - { name: b, types: [BED], mode: file }
        - { name: a, types: [BED], mode: file }
      outputs:
        - { name: out, types: [BED], mode: stdout }
    parameters:
      - { name: command, type: string, default: flt, required: true, hidden: true }
      - { name: invert, type: flag, flag: -v }
      - { name: contained, type: flag, flag: -C }
      - { name: window, type: integer, flag: -w }
      - { name: min_overlap, type: float, flag: -f }

  - id: bedtk.flt.vcf
    name: Filter VCF (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Keep the records of a VCF, plain or bgzipped, or of a gVCF, that overlap a BED of regions, or with invert those that do not. The header is kept.
    io:
      inputs:
        - { name: regions, types: [BED], mode: file }
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: command, type: string, default: flt, required: true, hidden: true }
      - { name: vcf, type: flag, flag: -c, required: true, hidden: true }
      - { name: invert, type: flag, flag: -v }
      - { name: contained, type: flag, flag: -C }
      - { name: window, type: integer, flag: -w }
      - { name: min_overlap, type: float, flag: -f }

  - id: bedtk.cov
    name: Coverage (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Breadth of coverage between A and B (fraction of A bases covered by B intervals).
    io:
      inputs:
        - { name: a, types: [BED], mode: file }
        - { name: b, types: [BED], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: cov, required: true, hidden: true }

  - id: bedtk.sum
    name: Sum (bedtk)
    category: Genomic Operations
    bin: bedtk
    description: Total length of all intervals in a BED file.
    io:
      inputs:
        - { name: in, types: [BED], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: sum, required: true, hidden: true }
