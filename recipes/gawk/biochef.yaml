apiVersion: v1

id: app.biochef.gawk
name: gawk
description: GNU implementation of awk - pattern-action programming language for text processing.

version: 5.4.1-bc.1
homepage: https://www.gnu.org/software/gawk/
license:
  spdx: GPL-3.0-or-later
  files: [COPYING]
  evidence_files: [main.c]
maintainers:
  - name: Biochef

source:
  repo: https://git.savannah.gnu.org/git/gawk.git
  tag: "gawk-5.4.1"
  version: "5.4.1"
  commit: "52af7f12758da12db0ddbdb117a84e0685cd2f72"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      outputDir: out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    buildTools: [make, gcc]
    outputDir: bin

runtime:
  modes: [wasm, native, remote]

operations:
  - id: gawk.script
    name: Script (gawk)
    category: Text Processing
    bin: gawk
    description: Run an inline gawk program on a text stream
    io:
      inputs:
        - { name: in, types: [TEXT, FASTA, FASTQ, Multi-FASTA, NUM, DNA, RNA, AminoAcids, LIST], mode: file }
      outputs:
        - { name: out, types: [TEXT, LIST], mode: stdout }
    parameters:
      - { name: field_separator, type: string, flag: -F }
      - { name: csv, type: flag, flag: --csv }
      - { name: variable_assign, type: string, flag: -v }
      - { name: traditional, type: flag, flag: -c }
      - { name: posix, type: flag, flag: -P }
      - { name: bignum, type: flag, flag: -M }
      - { name: sandbox, type: flag, flag: -S }
      - { name: characters_as_bytes, type: flag, flag: -b }
      - { name: non_decimal_data, type: flag, flag: -n }
      - { name: re_interval, type: flag, flag: -r }
      - { name: optimize, type: flag, flag: -O }
      - { name: no_optimize, type: flag, flag: -s }
      - { name: lint_old, type: flag, flag: -t }
      - { name: gen_pot, type: flag, flag: -g }
      - { name: program, type: string, flag: -e, required: true }

  - id: gawk.from.file
    name: From File (gawk)
    category: Text Processing
    bin: gawk
    description: Run a gawk program loaded from a file (script connected as workflow input)
    io:
      inputs:
        - { name: script, types: [TEXT], mode: file, flag: -f }
        - { name: in, types: [TEXT, FASTA, FASTQ, Multi-FASTA, NUM, DNA, RNA, AminoAcids, LIST], mode: file }
      outputs:
        - { name: out, types: [TEXT, LIST], mode: stdout }
    parameters:
      - { name: field_separator, type: string, flag: -F }
      - { name: csv, type: flag, flag: --csv }
      - { name: variable_assign, type: string, flag: -v }
      - { name: traditional, type: flag, flag: -c }
      - { name: posix, type: flag, flag: -P }
      - { name: bignum, type: flag, flag: -M }
      - { name: sandbox, type: flag, flag: -S }
      - { name: characters_as_bytes, type: flag, flag: -b }
      - { name: non_decimal_data, type: flag, flag: -n }
      - { name: re_interval, type: flag, flag: -r }
      - { name: optimize, type: flag, flag: -O }
      - { name: no_optimize, type: flag, flag: -s }
      - { name: lint_old, type: flag, flag: -t }
      - { name: gen_pot, type: flag, flag: -g }

  - id: gawk.script.with.library
    name: Script With Library (gawk)
    category: Text Processing
    bin: gawk
    description: Run an inline gawk program that uses the functions of a gawk library file (-i)
    io:
      inputs:
        - { name: library, types: [TEXT], mode: file, flag: -i }
        - { name: in, types: [TEXT, FASTA, FASTQ, Multi-FASTA, NUM, DNA, RNA, AminoAcids, LIST], mode: file }
      outputs:
        - { name: out, types: [TEXT, LIST], mode: stdout }
    parameters:
      - { name: field_separator, type: string, flag: -F }
      - { name: csv, type: flag, flag: --csv }
      - { name: variable_assign, type: string, flag: -v }
      - { name: traditional, type: flag, flag: -c }
      - { name: posix, type: flag, flag: -P }
      - { name: bignum, type: flag, flag: -M }
      - { name: sandbox, type: flag, flag: -S }
      - { name: characters_as_bytes, type: flag, flag: -b }
      - { name: non_decimal_data, type: flag, flag: -n }
      - { name: re_interval, type: flag, flag: -r }
      - { name: optimize, type: flag, flag: -O }
      - { name: no_optimize, type: flag, flag: -s }
      - { name: lint_old, type: flag, flag: -t }
      - { name: gen_pot, type: flag, flag: -g }
      - { name: program, type: string, flag: -e, required: true }
