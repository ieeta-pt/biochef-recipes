apiVersion: v1

id: app.biochef.lsd2
name: LSD2
description: LSD2 — least-squares method for estimating substitution rates and divergence dates from phylogenies. Takes a Newick tree plus tip date constraints and infers a time-scaled tree under temporal constraints. Used as the dating step downstream of phylogenetic inference (e.g. IQ-TREE, RAxML).

version: 2.3-bc.1
homepage: https://github.com/tothuhien/lsd2
license:
  spdx: GPL-3.0-or-later
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/tothuhien/lsd2
  commit: "26ba127b14ce05fce06a5774eb4c38e2efe26835"
  version: "2.3"

status: experimental

build:
  wasm:
    strategy: biowasm
    biowasm:
      package: lsd2

runtime:
  modes: [wasm, remote]

operations:
  - id: lsd2.date
    name: Date Tree (LSD2)
    category: Phylogenetics
    bin: lsd2
    description: Estimate divergence dates and substitution rate for a Newick tree given tip-date constraints. Outputs a time-scaled tree, rate estimate, and per-node dates.
    io:
      inputs:
        - { name: tree, types: [TEXT], mode: file, flag: -i }
        - { name: dates, types: [TEXT], mode: file, flag: -d }
        - { name: partition, types: [TEXT], mode: file, flag: -p }
        - { name: outgroups, types: [TEXT], mode: file, flag: -g }
      outputs:
        - { name: out, types: [TEXT], mode: file, flag: -o, filename: "lsd2_out" }
    parameters:
      - { name: seq_length, type: integer, flag: -s }
      - { name: variance, type: integer, flag: -v }
      - { name: root_option, type: string, flag: -r }
      - { name: remove_outgroups, type: flag, flag: -G }
      - { name: substitution_rate, type: float, flag: -t }
      - { name: root_date, type: float, flag: -a }
      - { name: tip_date, type: float, flag: -z }
      - { name: confidence_samples, type: integer, flag: -e }
      - { name: outlier_samples, type: integer, flag: -m }
      - { name: rounding_factor, type: integer, flag: -R }
      - { name: support_threshold, type: float, flag: -S }
      - { name: min_branch_threshold, type: float, flag: -l }
      - { name: min_internal_branch, type: float, flag: -u }
      - { name: min_external_branch, type: float, flag: -U }
      - { name: out_date_format, type: integer, flag: -D }
      - { name: keep_date_format, type: flag, flag: -F }
      - { name: verbose, type: flag, flag: -j }
