apiVersion: v1

id: app.biochef.vcflib
name: vcflib
description: >-
  vcflib is a C++ library and set of command-line tools for parsing, manipulating and analysing
  VCF files, built from source against its bundled htslib and WFA2-lib.

version: 1.0.15-bc.1
homepage: https://github.com/vcflib/vcflib
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/vcflib/vcflib
  tag: "v1.0.15"
  version: "1.0.15"
  commit: "beef6694d3b12bb9ccbc1f1f1c3657a51e48ae3c"

status: experimental

build:
  wasm:
    strategy: emscripten
    patches: [patches/filter-operand-check-and-sample-lists.patch, patches/wasm-cmake.patch]
    emscripten:
      outputDir: build
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    patches: [patches/filter-operand-check-and-sample-lists.patch, patches/native-static-portable-build.patch]
    buildTools: [make, gcc]
    outputDir: bin

runtime:
  modes: [wasm, native, remote]

operations:

  - id: vcflib.echo
    name: Echo (vcflib)
    category: Variant Analysis
    bin: vcfecho
    description: Read and re-emit a VCF file unchanged. Useful for validating the I/O layer.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters: []

  - id: vcflib.filter
    name: Filter (vcflib)
    category: Variant Analysis
    bin: vcffilter
    description: >-
      Keep the VCF records for which an expression on QUAL and INFO fields holds, such as
      "QUAL > 20 & DP > 10". Tokens are separated by spaces; the operators are > < = & | and !,
      with parentheses. genotype_filter applies an expression on FORMAT fields to each sample, and
      tag_pass writes a tag to the FILTER column of the records that pass instead of dropping the
      others. A malformed expression stops with an error.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: expression, type: string, flag: -f, default: "QUAL > 20", required: true }
      - { name: genotype_filter, type: string, flag: -g }
      - { name: tag_pass, type: string, flag: -t }
      - { name: invert, type: flag, flag: -v }

  - id: vcflib.breakmulti
    name: Break Multi-Allelics (vcflib)
    category: Variant Analysis
    bin: vcfbreakmulti
    description: Split multi-allelic records (e.g. G to C,A) into bi-allelic records.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF], mode: stdout }
    parameters: []

  - id: vcflib.allelicprimitives
    name: Allelic Primitives (vcflib)
    category: Variant Analysis
    bin: vcfallelicprimitives
    description: Decompose complex variants into SNPs and indels via WFA2 alignment.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF], mode: stdout }
    parameters:
      - { name: tag_parsed, type: string, flag: -t }
      - { name: keep_geno, type: flag, flag: -k }

  - id: vcflib.wave
    name: Wave Decomposition (vcflib)
    category: Variant Analysis
    bin: vcfwave
    description: Decompose complex variants using WFA2 wavefront alignment; reports SNP/INDEL/MNP/complex types.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF], mode: stdout }
    parameters:
      - { name: tag_parsed, type: string, flag: -t }
      - { name: keep_info, type: flag, flag: -k }

  - id: vcflib.streamsort
    name: Stream Sort (vcflib)
    category: Variant Analysis
    bin: vcfstreamsort
    description: Sort VCF records on a sliding window, without holding the whole input in memory.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: window, type: integer, flag: -w }

  - id: vcflib.uniq
    name: Uniq (vcflib)
    category: Variant Analysis
    bin: vcfuniq
    description: Drop duplicate variant records (CHROM, POS, REF, ALT). Input must be sorted.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters: []

  - id: vcflib.cat
    name: Concatenate (vcflib)
    category: Variant Analysis
    bin: vcfcat
    description: >-
      Concatenate two VCF files with the same samples, keeping the header of the first. The
      records are written in input order, not sorted.
    io:
      inputs:
        - { name: in1, types: [VCF, GVCF], mode: file }
        - { name: in2, types: [VCF, GVCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters: []

  - id: vcflib.combine
    name: Combine (vcflib)
    category: Variant Analysis
    bin: vcfcombine
    description: >-
      Combine two VCF files positionally into one multi-sample VCF. Records at the same site with
      the same alleles are merged, and samples missing from a record get no-calls.
    io:
      inputs:
        - { name: in1, types: [VCF, GVCF], mode: file }
        - { name: in2, types: [VCF, GVCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters: []

  - id: vcflib.check
    name: Check (vcflib)
    category: Variant Analysis
    bin: vcfcheck
    description: >-
      Report the records of a VCF whose REF allele differs from the FASTA reference, one line
      each. The output is empty when every REF matches.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
        - { name: reference, types: [FASTA, Multi-FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: ignore_case, type: flag, flag: -i }

  - id: vcflib.checkexclude
    name: Drop REF Mismatches (vcflib)
    category: Variant Analysis
    bin: vcfcheck
    description: Write the records of a VCF whose REF allele matches the FASTA reference.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
        - { name: reference, types: [FASTA, Multi-FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: exclude_failures, type: flag, flag: -x, required: true, hidden: true }
      - { name: ignore_case, type: flag, flag: -i }

  - id: vcflib.checkkeep
    name: Keep REF Mismatches (vcflib)
    category: Variant Analysis
    bin: vcfcheck
    description: Write the records of a VCF whose REF allele differs from the FASTA reference.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
        - { name: reference, types: [FASTA, Multi-FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: keep_failures, type: flag, flag: -k, required: true, hidden: true }
      - { name: ignore_case, type: flag, flag: -i }

  - id: vcflib.countalleles
    name: Count Alleles (vcflib)
    category: Variant Analysis
    bin: vcfcountalleles
    description: Emit the total number of REF+ALT alleles across the input.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters: []

  - id: vcflib.length
    name: Length (vcflib)
    category: Variant Analysis
    bin: vcflength
    description: Annotate each record with length, length.ref, length.alt.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF], mode: stdout }
    parameters: []

  - id: vcflib.samplenames
    name: Sample Names (vcflib)
    category: Variant Analysis
    bin: vcfsamplenames
    description: Emit sample names declared in the VCF header.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters: []

  - id: vcflib.keepsamples
    name: Keep Samples (vcflib)
    category: Variant Analysis
    bin: vcfkeepsamples
    description: >-
      Keep only the listed samples of a multi-sample VCF. samples takes one name or several,
      separated by commas or spaces; a name the VCF does not have stops with an error.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: vcf, type: string, default: "-", required: true, hidden: true }
      - { name: samples, type: string, default: sample, required: true }

  - id: vcflib.removesamples
    name: Remove Samples (vcflib)
    category: Variant Analysis
    bin: vcfremovesamples
    description: >-
      Remove the listed samples from a multi-sample VCF. samples takes one name or several,
      separated by commas or spaces; a name the VCF does not have stops with an error.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: vcf, type: string, default: "-", required: true, hidden: true }
      - { name: samples, type: string }

  - id: vcflib.tsv
    name: To TSV (vcflib)
    category: Variant Analysis
    bin: vcf2tsv
    description: Convert VCF to tab-separated values (TSV).
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: split_geno, type: flag, flag: -g }
      - { name: null_string, type: string, flag: -n }

  - id: vcflib.stats
    name: Stats (vcflib)
    category: Variant Analysis
    bin: vcfstats
    description: Per-site statistics including SNP/indel counts, Ts/Tv ratio, allele frequency.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters: []

  - id: vcflib.flatten
    name: Flatten (vcflib)
    category: Variant Analysis
    bin: vcfflatten
    description: Reduce overlapping variant records by keeping the highest-quality call.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
      outputs:
        - { name: out, types: [VCF], mode: stdout }
    parameters: []

  - id: vcflib.leftalign
    name: Left Align (vcflib)
    category: Variant Analysis
    bin: vcfleftalign
    description: Left-align indels against a reference FASTA, normalising representation.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
        - { name: reference, types: [FASTA], mode: file, flag: -r }
      outputs:
        - { name: out, types: [VCF], mode: stdout }
    parameters:
      - { name: window, type: integer, flag: -w }

  - id: vcflib.intersect
    name: Intersect (vcflib)
    category: Variant Analysis
    bin: vcfintersect
    description: Intersect or subtract two VCF files by chromosome and position.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF], mode: stdin }
        - { name: bed, types: [BED], mode: file, flag: -b }
      outputs:
        - { name: out, types: [VCF, GVCF], mode: stdout }
    parameters:
      - { name: invert, type: flag, flag: -v }
      - { name: window, type: integer, flag: -w }
