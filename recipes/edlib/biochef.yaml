apiVersion: v1

id: app.biochef.edlib
name: edlib
description: edlib — fast and lightweight library for sequence alignment using edit (Levenshtein) distance. The CLI tool edlib-aligner aligns each query in a FASTA to a target, with NW (global), HW (infix), or SHW (semi-global) modes. Outputs scores, alignment paths (CIGAR or NICE), and locations.

version: 1.2.7-bc.1
homepage: https://github.com/Martinsos/edlib
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/Martinsos/edlib
  tag: "v1.2.7"
  version: "1.2.7"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      buildsystem: make
      workDir: .
      outputDir: out
      commands:
        - 'em++ -O2 -std=c++11 -Iedlib/include -sFORCE_FILESYSTEM=1 -sEXPORTED_RUNTIME_METHODS=[''FS'',''callMain''] -sALLOW_MEMORY_GROWTH=1 -o edlib-aligner.js edlib/src/edlib.cpp apps/aligner/aligner.cpp'
        - 'mkdir -p out && mv edlib-aligner.js edlib-aligner.wasm out/'
        - "echo 'all:' > Makefile"
      env: []

runtime:
  modes: [wasm, remote]

operations:
  - id: edlib.align
    name: Align (edlib)
    category: Genomic Operations
    bin: edlib-aligner
    description: Pairwise sequence alignment using edit distance. Aligns each query in queries.fasta against target.fasta. Modes - NW (Needleman-Wunsch, global), HW (infix, query can be anywhere in target), SHW (semi-global, query prefix matches).
    io:
      inputs:
        - { name: queries, types: [FASTA, Multi-FASTA], mode: file }
        - { name: target, types: [FASTA, Multi-FASTA], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: silent, type: flag, flag: -s }
      - { name: mode, type: string, flag: -m, default: NW }
      - { name: top_n, type: integer, flag: -n }
      - { name: max_score, type: integer, flag: -k }
      - { name: print_path, type: flag, flag: -p }
      - { name: print_locations, type: flag, flag: -l }
      - { name: path_format, type: string, flag: -f }
      - { name: repeat, type: integer, flag: -r }
