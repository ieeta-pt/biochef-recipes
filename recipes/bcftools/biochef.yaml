apiVersion: v1

id: app.biochef.bcftools
name: BCFtools
description: Utilities for variant calling and manipulating VCF/BCF files.

version: 1.10-bc.2
homepage: https://github.com/samtools/bcftools
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/samtools/bcftools
  tag: "1.10"
  version: "1.10"
  commit: "9f0a0a2451bb64e52a12c4a586ffa5744a4bd965"

status: experimental

build:
  wasm:
    strategy: biowasm
    biowasm:
      package: bcftools

runtime:
  modes: [wasm, remote]

operations:
  - id: bcftools.view
    name: View (BCFtools)
    category: Format Conversion
    bin: bcftools
    description: View, subset and filter VCF/BCF files
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: view, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: samples, type: string, flag: -s }
      - { name: min_alleles, type: integer, flag: -m }
      - { name: max_alleles, type: integer, flag: -M }
      - { name: types, type: string, flag: -v }
      - { name: exclude_types, type: string, flag: -V }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: known, type: flag, flag: -k }
      - { name: novel, type: flag, flag: -n }
      - { name: drop_genotypes, type: flag, flag: -G }
      - { name: header_only, type: flag, flag: -h }
      - { name: no_header, type: flag, flag: -H }

  - id: bcftools.view.region
    name: View Region (BCFtools)
    category: Format Conversion
    bin: bcftools
    description: Read only the records of a region, such as chr1:1000-2000, through the index of a bgzipped VCF or a BCF, with the filters of View.
    io:
      inputs:
        - { name: in, types: [VCF_GZ, GVCF_GZ, BCF], mode: file, filename: in.vcf.gz }
        - { name: index, types: [TBI, CSI], mode: sidecar, filename: in.vcf.gz.csi }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: view, required: true, hidden: true }
      - { name: regions, type: string, flag: -r, required: true }
      - { name: output_type, type: string, flag: -O }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: drop_genotypes, type: flag, flag: -G }

  - id: bcftools.query
    name: Query (BCFtools)
    category: Information and Analysis
    bin: bcftools
    description: Extract fields from VCF/BCF as a tab-delimited table
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: query, required: true, hidden: true }
      - { name: format, type: string, flag: -f, required: true }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: samples, type: string, flag: -s }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: print_header, type: flag, flag: -H }
      - { name: allow_undef_tags, type: flag, flag: -u }

  - id: bcftools.query.samples
    name: List Samples (BCFtools)
    category: Information and Analysis
    bin: bcftools
    description: Write the names of the samples in a VCF or BCF, one per line.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [SAMPLE_LIST], mode: stdout }
    parameters:
      - { name: command, type: string, default: query, required: true, hidden: true }
      - { name: list_samples, type: flag, flag: -l, required: true, hidden: true }

  - id: bcftools.stats
    name: Stats (BCFtools)
    category: Information and Analysis
    bin: bcftools
    description: Produce VCF/BCF statistics
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: stats, required: true, hidden: true }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: samples, type: string, flag: -s }
      - { name: apply_filters, type: string, flag: -f }
      - { name: split_by_id, type: flag, flag: -I }
      - { name: depth, type: string, flag: -d }
      - { name: af_bins, type: string, flag: --af-bins }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }

  - id: bcftools.filter
    name: Filter (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Apply soft or hard filters to VCF/BCF
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: filter, required: true, hidden: true }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: soft_filter, type: string, flag: -s }
      - { name: mode, type: string, flag: -m }
      - { name: snp_gap, type: integer, flag: -g }
      - { name: indel_gap, type: integer, flag: -G }
      - { name: set_GTs, type: string, flag: -S }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: output_type, type: string, flag: -O }

  - id: bcftools.sort
    name: Sort (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Sort VCF/BCF file by chromosome and position
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: sort, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }
      - { name: max_mem, type: string, flag: -m }

  - id: bcftools.norm
    name: Norm (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Left-align and normalize indels; split or join multiallelic sites
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: norm, required: true, hidden: true }
      - { name: check_ref, type: string, flag: -c }
      - { name: multiallelics, type: string, flag: -m }
      - { name: do_not_normalize, type: flag, flag: -N }
      - { name: rm_dup, type: string, flag: -d }
      - { name: site_win, type: integer, flag: -w }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: output_type, type: string, flag: -O }

  - id: bcftools.concat
    name: Concat (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Concatenate or combine VCF/BCF files with the same set of samples
    io:
      inputs:
        - { name: in1, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: in2, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: concat, required: true, hidden: true }
      - { name: allow_overlaps, type: flag, flag: -a }
      - { name: compact_PS, type: flag, flag: -c }
      - { name: rm_dups, type: string, flag: -d }
      - { name: remove_duplicates, type: flag, flag: -D }
      - { name: ligate, type: flag, flag: -l }
      - { name: naive, type: flag, flag: -n }
      - { name: output_type, type: string, flag: -O }

  - id: bcftools.merge
    name: Merge (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Merge two bgzipped VCFs or BCFs with different samples into one file with all of them. Each input needs its index (TBI or CSI), which bcftools reads beside it.
    io:
      inputs:
        - { name: in1, types: [VCF_GZ, GVCF_GZ, BCF], mode: file, filename: in1.vcf.gz }
        - { name: index1, types: [TBI, CSI], mode: sidecar, filename: in1.vcf.gz.csi }
        - { name: in2, types: [VCF_GZ, GVCF_GZ, BCF], mode: file, filename: in2.vcf.gz }
        - { name: index2, types: [TBI, CSI], mode: sidecar, filename: in2.vcf.gz.csi }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: merge, required: true, hidden: true }
      - { name: force_samples, type: flag, flag: --force-samples }
      - { name: print_header, type: flag, flag: --print-header }
      - { name: use_header, type: string, flag: --use-header }
      - { name: missing_to_ref, type: flag, flag: "-0" }
      - { name: apply_filters, type: string, flag: -f }
      - { name: filter_logic, type: string, flag: -F }
      - { name: info_rules, type: string, flag: -i }
      - { name: merge, type: string, flag: -m }
      - { name: regions, type: string, flag: -r }
      - { name: output_type, type: string, flag: -O }

  - id: bcftools.isec
    name: Isec (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Intersect two bgzipped VCFs or BCFs. By default it writes the records of the first that the second also has; nfiles and write choose otherwise. Each input needs its index (TBI or CSI), which bcftools reads beside it.
    io:
      inputs:
        - { name: in1, types: [VCF_GZ, GVCF_GZ, BCF], mode: file, filename: in1.vcf.gz }
        - { name: index1, types: [TBI, CSI], mode: sidecar, filename: in1.vcf.gz.csi }
        - { name: in2, types: [VCF_GZ, GVCF_GZ, BCF], mode: file, filename: in2.vcf.gz }
        - { name: index2, types: [TBI, CSI], mode: sidecar, filename: in2.vcf.gz.csi }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: isec, required: true, hidden: true }
      - { name: nfiles, type: string, flag: -n, default: "=2", required: true }
      - { name: write, type: string, flag: -w, default: "1", required: true }
      - { name: collapse, type: string, flag: -c }
      - { name: apply_filters, type: string, flag: -f }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: output_type, type: string, flag: -O }

  - id: bcftools.annotate
    name: Annotate (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Add or remove annotations in VCF/BCF
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: annotate, required: true, hidden: true }
      - { name: set_id, type: string, flag: -I }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: remove, type: string, flag: -x }
      - { name: samples, type: string, flag: -s }
      - { name: keep_sites, type: flag, flag: -k }
      - { name: single_overlaps, type: flag, flag: --single-overlaps }
      - { name: regions, type: string, flag: -r }
      - { name: output_type, type: string, flag: -O }
      - { name: no_version, type: flag, flag: --no-version }

  - id: bcftools.consensus
    name: Consensus (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Apply the variants of a bgzipped VCF or a BCF to a reference FASTA and write the consensus sequence. The variants need their index (TBI or CSI), which bcftools reads beside them.
    io:
      inputs:
        - { name: in, types: [VCF_GZ, GVCF_GZ, BCF], mode: file, filename: in.vcf.gz }
        - { name: index, types: [TBI, CSI], mode: sidecar, filename: in.vcf.gz.csi }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [FASTA], mode: stdout }
    parameters:
      - { name: command, type: string, default: consensus, required: true, hidden: true }
      - { name: chain, type: string, flag: -c }
      - { name: haplotype, type: string, flag: -H }
      - { name: iupac_codes, type: flag, flag: -I }
      - { name: mask, type: string, flag: -m }
      - { name: missing, type: string, flag: -M }
      - { name: sample, type: string, flag: -s }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: prefix, type: string, flag: -p }

  - id: bcftools.index
    name: Index (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Index a bgzipped VCF or gVCF, or a BCF, so tools can read a region of it without reading it all. The index is a CSI file.
    io:
      inputs:
        - { name: in, types: [VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [CSI], mode: file, flag: -o, filename: out.csi }
    parameters:
      - { name: command, type: string, default: index, required: true, hidden: true }
      - { name: force, type: flag, flag: -f }
      - { name: min_shift, type: integer, flag: -m }

  - id: bcftools.index.tbi
    name: Index TBI (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Index a bgzipped VCF or gVCF as tabix does, so tools can read a region of it without reading it all. The index is a TBI file.
    io:
      inputs:
        - { name: in, types: [VCF_GZ, GVCF_GZ], mode: file }
      outputs:
        - { name: out, types: [TBI], mode: file, flag: -o, filename: out.tbi }
    parameters:
      - { name: command, type: string, default: index, required: true, hidden: true }
      - { name: tbi, type: flag, flag: --tbi, required: true, hidden: true }
      - { name: force, type: flag, flag: -f }

  - id: bcftools.convert.gvcf2vcf
    name: gVCF to VCF (BCFtools)
    category: Format Conversion
    bin: bcftools
    description: Expand the reference blocks of a gVCF into one record per site, against the reference FASTA, and write a plain VCF.
    io:
      inputs:
        - { name: in, types: [GVCF, GVCF_GZ], mode: file, flag: --gvcf2vcf }
        - { name: fasta_ref, types: [FASTA, Multi-FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [VCF, VCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: convert, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }

  - id: bcftools.mpileup
    name: Mpileup (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Pile up reads from an alignment against a reference and emit genotype likelihoods for every position. Feed the result to Call to obtain variants. The whole alignment is streamed unless regions are given, so use small or subsetted BAMs in the browser.
    io:
      inputs:
        - { name: bam, types: [BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: --output }
    parameters:
      - { name: command, type: string, default: mpileup, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }
      - { name: annotate, type: string, flag: -a }
      - { name: gvcf, type: string, flag: -g }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: samples, type: string, flag: -s }
      - { name: max_depth, type: integer, flag: -d }
      - { name: min_mq, type: integer, flag: -q }
      - { name: min_bq, type: integer, flag: -Q }
      - { name: adjust_mq, type: integer, flag: -C }
      - { name: count_orphans, type: flag, flag: -A }
      - { name: no_baq, type: flag, flag: -B }
      - { name: redo_baq, type: flag, flag: -E }
      - { name: ignore_overlaps, type: flag, flag: -x }
      - { name: ignore_rg, type: flag, flag: --ignore-RG }
      - { name: incl_flags, type: string, flag: --incl-flags }
      - { name: excl_flags, type: string, flag: --excl-flags }
      - { name: skip_indels, type: flag, flag: -I }
      - { name: max_idepth, type: integer, flag: -L }
      - { name: min_ireads, type: integer, flag: -m }
      - { name: gap_frac, type: float, flag: -F }
      - { name: ext_prob, type: integer, flag: -e }
      - { name: open_prob, type: integer, flag: --open-prob }
      - { name: tandem_qual, type: integer, flag: --tandem-qual }
      - { name: per_sample_mf, type: flag, flag: -p }
      - { name: platforms, type: string, flag: -P }
      - { name: illumina13, type: flag, flag: "-6" }
      - { name: no_version, type: flag, flag: --no-version }

  - id: bcftools.call
    name: Call (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Call SNPs and indels from the genotype likelihoods mpileup writes, with the multiallelic caller (-m), which bcftools recommends. With gvcf it writes a gVCF.
    io:
      inputs:
        - { name: in, types: [VCF, VCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: call, required: true, hidden: true }
      - { name: multiallelic_caller, type: flag, flag: -m, required: true, hidden: true }
      - { name: variants_only, type: flag, flag: -v }
      - { name: output_type, type: string, flag: -O }
      - { name: keep_alts, type: flag, flag: -A }
      - { name: keep_masked_ref, type: flag, flag: -M }
      - { name: skip_variants, type: string, flag: -V }
      - { name: format_fields, type: string, flag: -f }
      - { name: prior_freqs, type: string, flag: -F }
      - { name: group_samples, type: string, flag: -G }
      - { name: gvcf, type: string, flag: -g }
      - { name: constrain, type: string, flag: -C }
      - { name: novel_rate, type: string, flag: -n }
      - { name: pval_threshold, type: float, flag: -p }
      - { name: prior, type: float, flag: -P }
      - { name: ploidy, type: string, flag: --ploidy }
      - { name: samples, type: string, flag: -s }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: no_version, type: flag, flag: --no-version }

  - id: bcftools.call.consensus
    name: Call Consensus (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Call SNPs and indels from the genotype likelihoods mpileup writes, with the original consensus caller (-c), which handles at most two alleles a site.
    io:
      inputs:
        - { name: in, types: [VCF, VCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: call, required: true, hidden: true }
      - { name: consensus_caller, type: flag, flag: -c, required: true, hidden: true }
      - { name: variants_only, type: flag, flag: -v }
      - { name: output_type, type: string, flag: -O }
      - { name: keep_alts, type: flag, flag: -A }
      - { name: keep_masked_ref, type: flag, flag: -M }
      - { name: skip_variants, type: string, flag: -V }
      - { name: format_fields, type: string, flag: -f }
      - { name: prior_freqs, type: string, flag: -F }
      - { name: group_samples, type: string, flag: -G }
      - { name: gvcf, type: string, flag: -g }
      - { name: constrain, type: string, flag: -C }
      - { name: novel_rate, type: string, flag: -n }
      - { name: pval_threshold, type: float, flag: -p }
      - { name: prior, type: float, flag: -P }
      - { name: ploidy, type: string, flag: --ploidy }
      - { name: samples, type: string, flag: -s }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: no_version, type: flag, flag: --no-version }

  - id: bcftools.csq
    name: Csq (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Haplotype-aware consequence caller; annotates variants with protein-coding consequences in a BCSQ tag. Requires an Ensembl or GENCODE style GFF3 whose attributes use the gene and transcript ID prefixes; annotations from other sources are silently ignored. Suitable for small genomes such as viral, bacterial and organelle only.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: -f }
        - { name: gff, types: [GFF], mode: file, flag: -g }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: csq, required: true, hidden: true }
      - { name: phase, type: string, flag: -p, default: a, required: true }
      - { name: output_type, type: string, flag: -O }
      - { name: ncsq, type: integer, flag: -n }
      - { name: custom_tag, type: string, flag: -c }
      - { name: local_csq, type: flag, flag: -l }
      - { name: brief_predictions, type: flag, flag: -b }
      - { name: verbose, type: integer, flag: -v }
      - { name: force, type: flag, flag: --force }
      - { name: samples, type: string, flag: -s }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: targets, type: string, flag: -t }
      - { name: no_version, type: flag, flag: --no-version }

  - id: bcftools.roh
    name: Roh (BCFtools)
    category: Information and Analysis
    bin: bcftools
    description: Detect runs of homozygosity and autozygous segments with a hidden Markov model. Sites whose allele frequency cannot be determined are skipped, so a default allele frequency is supplied; clear af_dflt and choose af_tag or estimate_af if the input already carries frequencies.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: roh, required: true, hidden: true }
      - { name: af_dflt, type: float, flag: --AF-dflt, default: 0.4, required: true }
      - { name: af_tag, type: string, flag: --AF-tag }
      - { name: estimate_af, type: string, flag: -e }
      - { name: gts_only, type: float, flag: -G }
      - { name: ignore_homref, type: flag, flag: -i }
      - { name: skip_indels, type: flag, flag: -I }
      - { name: buffer_size, type: string, flag: -b }
      - { name: rec_rate, type: float, flag: -M }
      - { name: hw_to_az, type: float, flag: -a }
      - { name: az_to_hw, type: float, flag: -H }
      - { name: viterbi_training, type: float, flag: -V }
      - { name: samples, type: string, flag: -s }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }
      - { name: include, type: string, flag: --include }
      - { name: exclude, type: string, flag: --exclude }

  - id: bcftools.gtcheck
    name: Gtcheck (BCFtools)
    category: Information and Analysis
    bin: bcftools
    description: Cross-check the genotypes of every sample against every other sample in a single multi-sample file to detect sample swaps and contamination. Reports pairwise discordance as a tab-delimited table.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: gtcheck, required: true, hidden: true }
      - { name: all_sites, type: flag, flag: -a }
      - { name: cluster, type: string, flag: -c }
      - { name: gts_only, type: integer, flag: -G }
      - { name: homs_only, type: flag, flag: -H }
      - { name: query_sample, type: string, flag: -s }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }

  - id: bcftools.reheader
    name: Reheader (BCFtools)
    category: Format Conversion
    bin: bcftools
    description: Replace the header of a VCF/BCF with the contents of a supplied header file, leaving all records untouched. The output format always matches the input format.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: header, types: [VCF, TEXT], mode: file, flag: -h }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: reheader, required: true, hidden: true }

  - id: bcftools.annotate.header
    name: Annotate Header (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Append lines from a header file to the VCF/BCF header, for example to declare INFO or FORMAT tags that the records already use but the header does not define.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: header_lines, types: [VCF_HEADER], mode: file, flag: -h }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: annotate, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }
      - { name: set_id, type: string, flag: -I }
      - { name: remove, type: string, flag: -x }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: samples, type: string, flag: -s }
      - { name: keep_sites, type: flag, flag: -k }
      - { name: no_version, type: flag, flag: --no-version }

  - id: bcftools.norm.split
    name: Split Multiallelics (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Split multiallelic sites into separate records, or join biallelic records back into multiallelic sites. Needs no reference genome, unlike the full Norm operation which also left-aligns indels.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: norm, required: true, hidden: true }
      - { name: multiallelics, type: string, flag: -m, default: "-both", required: true }
      - { name: rm_dup, type: string, flag: -d }
      - { name: output_type, type: string, flag: -O }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }

  - id: bcftools.view.samples
    name: Subset Samples (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Keep or drop samples listed in a file, one sample name per line. Prefix the list with a caret to exclude the named samples instead of keeping them.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: samples_file, types: [SAMPLE_LIST], mode: file, flag: -S }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: view, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }
      - { name: min_alleles, type: integer, flag: -m }
      - { name: max_alleles, type: integer, flag: -M }
      - { name: types, type: string, flag: -v }
      - { name: exclude_types, type: string, flag: -V }
      - { name: include, type: string, flag: -i }
      - { name: exclude, type: string, flag: -e }
      - { name: drop_genotypes, type: flag, flag: -G }
      - { name: no_header, type: flag, flag: -H }
      - { name: regions, type: string, flag: -r }
      - { name: targets, type: string, flag: -t }

  - id: bcftools.annotate.rename
    name: Rename Chromosomes (BCFtools)
    category: Genomic Operations
    bin: bcftools
    description: Rename contigs using a two-column file mapping the old name to the new name, one pair per line separated by whitespace. Use this to reconcile chr-prefixed and unprefixed references.
    io:
      inputs:
        - { name: in, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file }
        - { name: rename_chrs, types: [TEXT], mode: file, flag: --rename-chrs }
      outputs:
        - { name: out, types: [VCF, GVCF, VCF_GZ, GVCF_GZ, BCF], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: annotate, required: true, hidden: true }
      - { name: output_type, type: string, flag: -O }
      - { name: no_version, type: flag, flag: --no-version }
