apiVersion: v1

id: app.biochef.gffcompare
name: GffCompare
description: "GffCompare compares transcripts assembled from RNA-seq, by StringTie, Cufflinks or Scallop, with a reference annotation: it gives each one a class code (= for a match, j for a new isoform, u for a new locus, and so on) and reports sensitivity and precision at the base, exon, intron, transcript and locus levels. It also collapses redundant transcripts. trmap, shipped with it, classifies how each query transcript overlaps the reference."

version: 0.12.10-bc.1
homepage: https://github.com/gpertea/gffcompare
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/gpertea/gffcompare
  commit: "29512d2a354442e92aa5503a549a8ad28ac246a2"
  version: "0.12.10"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      emscriptenVersion: 4.0.18
      outputDir: out
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    buildTools: [make, gcc]

runtime:
  modes: [wasm, native, remote]

operations:
  - id: gffcompare.compare
    name: Compare Transcripts (GffCompare)
    category: Genomic Operations
    bin: gffcompare
    description: "Compare a GTF or GFF of transcripts with a reference annotation. Writes the accuracy statistics, the transcripts annotated with their class code and closest reference transcript, the loci, the tracking table, the tmap (each query transcript and its closest reference) and the refmap (each reference transcript and the queries that match it), and the splice junctions not in the reference. With the options that collapse or rename transcripts, the transcripts are written as a combined, non-redundant set instead."
    io:
      inputs:
        - &query { name: query, types: [GFF, GTF], mode: file }
        - &reference { name: reference, types: [GFF, GTF], mode: file, flag: -r }
      outputs:
        - &stats { name: stats, types: [TEXT], mode: file, flag: --bc-stats, filename: gffcmp.stats }
        - &gtf { name: transcripts, types: [GTF], mode: file, flag: --bc-gtf, filename: gffcmp.gtf }
        - &loci { name: loci, types: [TEXT], mode: file, flag: --bc-loci, filename: gffcmp.loci }
        - &tracking { name: tracking, types: [TEXT], mode: file, flag: --bc-tracking, filename: gffcmp.tracking }
        - &tmap { name: tmap, types: [TEXT], mode: file, flag: --bc-tmap, filename: gffcmp.tmap }
        - { name: refmap, types: [TEXT], mode: file, flag: --bc-refmap, filename: gffcmp.refmap }
        - { name: novel_junctions, types: [TEXT], mode: file, flag: -j, filename: gffcmp.novel_junctions.tab }
    parameters: &compare_parameters
      - { name: reduce_references, type: flag, flag: -R }
      - { name: reduce_queries, type: flag, flag: -Q }
      - { name: multi_exon_only, type: flag, flag: -M }
      - { name: multi_exon_references_only, type: flag, flag: -N }
      - &end_range { name: exon_end_range, type: integer, flag: -e, default: 100 }
      - &tss_distance { name: tss_distance, type: integer, flag: -d, default: 100 }
      - &strict_match { name: strict_match, type: flag, flag: --strict-match }
      - { name: cds_match, type: flag, flag: --cds-match }
      - { name: chromosome_stats, type: flag, flag: --chr-stats }
      - &no_merge { name: no_exon_merge, type: flag, flag: --no-merge }
      - &discard_duplicates { name: discard_duplicates, type: flag, flag: -D }
      - &strict_duplicates { name: strict_duplicates, type: flag, flag: -S }
      - &collapse { name: collapse_contained, type: flag, flag: -C }
      - &collapse_tss { name: collapse_keep_alt_tss, type: flag, flag: -A }
      - &collapse_sticking { name: collapse_sticking_out, type: flag, flag: -X }
      - &collapse_single { name: collapse_single_exon, type: flag, flag: --cset }
      - { name: keep_reference_matching, type: flag, flag: -K }
      - &prefix { name: transcript_prefix, type: string, flag: -p }

  - id: gffcompare.compare.genome
    name: Compare Transcripts with Genome (GffCompare)
    category: Genomic Operations
    bin: gffcompare
    description: "Compare transcripts with a reference annotation as Compare Transcripts does, with the genome in FASTA: transcripts that lie mostly in soft-masked (lower-case) repeats get the class code r."
    io:
      inputs:
        - *query
        - *reference
        - { name: genome, types: [FASTA, Multi-FASTA], mode: file, flag: -s }
      outputs:
        - *stats
        - *gtf
        - *loci
        - *tracking
        - *tmap
        - { name: refmap, types: [TEXT], mode: file, flag: --bc-refmap, filename: gffcmp.refmap }
        - { name: novel_junctions, types: [TEXT], mode: file, flag: -j, filename: gffcmp.novel_junctions.tab }
    parameters: *compare_parameters

  - id: gffcompare.collapse
    name: Collapse Transcripts (GffCompare)
    category: Genomic Operations
    bin: gffcompare
    description: "Cluster the transcripts of a GTF or GFF into loci without a reference, and write them as a non-redundant set: transcripts with the same intron chain are written once, and with the collapse options, so are transcripts contained in others. Also writes the statistics, the loci, the tracking table and the tmap."
    io:
      inputs:
        - *query
      outputs:
        - *stats
        - *gtf
        - *loci
        - *tracking
        - *tmap
    parameters:
      - { name: discard_duplicates, type: flag, flag: -D, required: true, hidden: true }
      - *end_range
      - *tss_distance
      - *strict_match
      - *no_merge
      - *strict_duplicates
      - *collapse
      - *collapse_tss
      - *collapse_sticking
      - *collapse_single
      - *prefix

  - id: gffcompare.trmap
    name: Transcript Overlap Map (trmap)
    category: Genomic Operations
    bin: trmap
    description: "For each query transcript, list the reference transcripts it overlaps with their class codes, or with the table options one line per overlap or per query. The table options, -T, -J and -S, are exclusive, and best_only needs the overlap table."
    io:
      inputs:
        - { name: reference, types: [GFF, GTF], mode: file }
        - { name: query, types: [GFF, GTF], mode: file }
      outputs:
        - &trmap_out { name: out, types: [TEXT], mode: file, flag: -o, filename: trmap.txt }
    parameters: &trmap_parameters
      - { name: class_codes, type: string, flag: -c }
      - { name: overlap_table, type: flag, flag: -T }
      - { name: junction_table, type: flag, flag: -J }
      - { name: simple_overlap, type: flag, flag: -S }
      - { name: best_only, type: flag, flag: -B }
      - { name: strict_match, type: flag, flag: --strict-match }
      - { name: show_cds, type: flag, flag: --show-cds }

  - id: gffcompare.trmap.self
    name: Transcript Self-Overlap Map (trmap)
    category: Genomic Operations
    bin: trmap
    description: "Map the transcripts of one GTF or GFF against each other, as Transcript Overlap Map does with a reference."
    io:
      inputs:
        - { name: annotation, types: [GFF, GTF], mode: file }
      outputs:
        - *trmap_out
    parameters:
      - { name: self, type: flag, flag: --self, required: true, hidden: true }
      - { name: class_codes, type: string, flag: -c }
      - { name: overlap_table, type: flag, flag: -T }
      - { name: junction_table, type: flag, flag: -J }
      - { name: simple_overlap, type: flag, flag: -S }
      - { name: best_only, type: flag, flag: -B }
      - { name: strict_match, type: flag, flag: --strict-match }
      - { name: show_cds, type: flag, flag: --show-cds }
