apiVersion: v1

id: app.biochef.minigraph
name: minigraph
description: minigraph — sequence-to-graph alignment and graph generation for pangenomes. Aligns FASTA queries to a graph genome (GFA), and can build a graph by progressively integrating new sequences. Complement to minimap2 (linear references) and gfatools (graph manipulation).

version: 0.21.606-bc.1
homepage: https://github.com/lh3/minigraph
license:
  spdx: MIT
  files: [LICENSE.txt]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/lh3/minigraph
  commit: "2f569ebe3071fcb242f1bf0eabbb917941b47239"
  version: "0.21-r606"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    buildTools: [make]

runtime:
  modes: [wasm, native, remote]

operations:
  - id: minigraph.align
    name: Align (minigraph)
    category: Genomic Operations
    bin: minigraph
    description: Align queries to a graph genome (GFA). Outputs GAF (Graph Alignment Format). With --vc on a GFA reference and a FASTA assembly, infers variant calls in VCF form.
    io:
      inputs:
        - { name: graph, types: [GFA], mode: file }
        - { name: query, types: [FASTA, Multi-FASTA, FASTQ], mode: file }
      outputs:
        - { name: out, types: [GAF], mode: file, flag: -o }
    parameters:
      - { name: kmer_length, type: integer, flag: -k, default: 17 }
      - { name: window_size, type: integer, flag: -w }
      - { name: base_alignment, type: flag, flag: -c }
      - { name: preset, type: string, flag: -x }
      - { name: threads, type: integer, flag: -t, default: 1 }
      - { name: max_fragment, type: integer, flag: -F }
      - { name: chain_min_score, type: string, flag: -m }
      - { name: divergence, type: float, flag: -j }
      - { name: bandwidth, type: string, flag: -r }
      - { name: min_minimizers, type: string, flag: -n }
      - { name: output_format, type: string, flag: -S }

  - id: minigraph.ggen
    name: Generate Graph (minigraph)
    category: Genomic Operations
    bin: minigraph
    description: Build or extend a graph genome by progressively integrating new sequences into a reference GFA.
    io:
      inputs:
        - { name: graph, types: [GFA], mode: file }
        - { name: sequences, types: [FASTA, Multi-FASTA], mode: file }
      outputs:
        - { name: out, types: [GFA], mode: file, flag: -o }
    parameters:
      - { name: graph_gen, type: string, flag: --ggen, default: "simple" }
      - { name: kmer_length, type: integer, flag: -k }
      - { name: threads, type: integer, flag: -t, default: 1 }
      - { name: preset, type: string, flag: -x }
      - { name: bandwidth, type: string, flag: -r }
