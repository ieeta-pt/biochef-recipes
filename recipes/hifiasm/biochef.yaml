apiVersion: v1

id: app.biochef.hifiasm
name: hifiasm
description: hifiasm — fast de novo haplotype-resolved assembler for PacBio HiFi reads (and Oxford Nanopore Q20+). The standard tool for telomere-to-telomere style assemblies of complex eukaryotes. Optionally consumes Hi-C reads and trio short-read data for phasing.

version: 0.25.0-bc.1
homepage: https://github.com/chhylp123/hifiasm
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/chhylp123/hifiasm
  commit: "ec9a8b222d149d25b7355e83765698640d59b189"
  version: "0.25.0"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      outputDir: out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildScript: build-native.sh
    buildTools: [make]
    outputDir: .

runtime:
  modes: [wasm, native, remote]

operations:
  - id: hifiasm.assemble
    name: Assemble (hifiasm)
    category: Genomic Operations
    bin: hifiasm
    description: De novo assembly of PacBio HiFi (or ONT Q20+) long reads. Produces a haplotype-resolved assembly in GFA format. Add --ont for Oxford Nanopore reads.
    io:
      inputs:
        - { name: reads, types: [FASTA, Multi-FASTA, FASTQ], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: file, flag: -o }
    parameters:
      - { name: threads, type: integer, flag: -t, default: 1 }
      - { name: ont, type: flag, flag: --ont }
      - { name: kmer_length, type: integer, flag: -k }
      - { name: window_size, type: integer, flag: -w }
      - { name: bloom_bits, type: integer, flag: -f }
      - { name: max_kmer_drop, type: float, flag: -D }
      - { name: max_overlaps, type: integer, flag: -N }
      - { name: min_unitig_length, type: integer, flag: --min-unitig-len }
      - { name: hom_cov, type: integer, flag: --hom-cov }
      - { name: similarity_threshold, type: float, flag: -s }
      - { name: chimeric_drop_ratio, type: float, flag: -O }
      - { name: ban_unbalanced_haplotypes, type: flag, flag: --hg-size }
      - { name: write_paf, type: flag, flag: --write-paf }
      - { name: write_ec, type: flag, flag: --write-ec }
      - { name: dual_scaff, type: flag, flag: --dual-scaf }
