      - { name: break_above_coverage, type: integer, flag: --h-cov, default: -1 }
      - { name: break_overlap_rate, type: float, flag: --m-rate, default: 0.75 }
      - { name: tip_contig_reads, type: integer, flag: --ctg-n, default: 3 }
      - { name: purge_level, type: integer, flag: -l }
      - { name: purge_similarity, type: float, flag: -s }
      - { name: purge_min_overlapped_reads, type: integer, flag: -O, default: 1 }
      - { name: purge_max_coverage, type: integer, flag: --purge-max }
      - { name: haplotypes, type: integer, flag: --n-hap, default: 2 }
      - { name: telomere_motif, type: string, flag: --telo-m }
      - { name: telomere_penalty, type: integer, flag: --telo-p, default: 1 }
      - { name: telomere_max_drop, type: integer, flag: --telo-d, default: 2000 }
