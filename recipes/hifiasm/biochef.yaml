      - { name: dual_scaffolding, type: flag, flag: --dual-scaf }
      - { name: scaffold_max_gap, type: integer, flag: --scaf-gap, default: 3000000 }
      - { name: binned_kmer_min, type: integer, flag: -c, default: 2 }
      - { name: binned_kmer_max, type: integer, flag: -d, default: 5 }
      - { name: max_unexpected_reads, type: integer, flag: --t-occ, default: 60 }
      - { name: trio_dual, type: flag, flag: --trio-dual }

  - id: hifiasm.assemble.trio.read.names
    name: Assemble Trio From Read Names (hifiasm)
    category: Genomic Operations
    bin: hifiasm
    description: Assemble the reads of a child into its paternal and maternal haplotypes, given the names of the reads that come from each parent (-3, -4). Writes the contig graphs and the unitig graphs as GFA.
