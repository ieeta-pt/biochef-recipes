apiVersion: v1

id: app.biochef.samtools
name: samtools
description: Utilities for manipulating SAM/BAM/CRAM alignment files.

version: 1.21-bc.2
homepage: https://github.com/samtools/samtools
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/samtools/samtools
  tag: "1.21"
  version: "1.21"
  commit: "ec8bf989bd852cf46901b3e1a7d06d6fa10a79ff"

status: experimental

build:
  wasm:
    strategy: biowasm
    biowasm:
      package: samtools

runtime:
  modes: [wasm, remote]

operations:
  - id: samtools.view
    name: View (samtools)
    category: Format Conversion
    bin: samtools
    description: View, subset and convert SAM/BAM/CRAM alignments
    io:
      inputs:
        - { name: in, types: [SAM, BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [SAM, BAM, CRAM], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: view, required: true, hidden: true }
      - { name: bam_output, type: flag, flag: -b }
      - { name: cram_output, type: flag, flag: -C }
      - { name: with_header, type: flag, flag: -h }
      - { name: header_only, type: flag, flag: -H }
      - { name: count_only, type: flag, flag: -c }
      - { name: require_flags, type: integer, flag: -f }
      - { name: exclude_flags, type: integer, flag: -F }
      - { name: min_mapq, type: integer, flag: -q }
      - { name: read_group, type: string, flag: -r }
      - { name: subsample, type: float, flag: --subsample }
      - { name: min_qlen, type: integer, flag: -m }
      - { name: filter_expr, type: string, flag: -e }
      - { name: no_pg, type: flag, flag: --no-PG }

  - id: samtools.sort
    name: Sort (samtools)
    category: Genomic Operations
    bin: samtools
    description: Sort SAM/BAM/CRAM by coordinate or read name
    io:
      inputs:
        - { name: in, types: [SAM, BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [SAM, BAM, CRAM], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: sort, required: true, hidden: true }
      - { name: output_format, type: string, flag: -O }
      - { name: name_sort, type: flag, flag: -n }
      - { name: tag_sort, type: string, flag: -t }
      - { name: max_mem, type: string, flag: -m }
      - { name: minimiser_sort, type: flag, flag: -M }

  - id: samtools.index
    name: Index (samtools)
    category: Genomic Operations
    bin: samtools
    description: Index a coordinate-sorted BAM (writes a .bai index file)
    io:
      inputs:
        - { name: in, types: [BAM], mode: file }
      outputs:
        - { name: out, types: [BAI], mode: file, flag: -o, filename: "in.txt.bai"}
    parameters:
      - { name: command, type: string, default: index, required: true, hidden: true }

  - id: samtools.faidx
    name: Faidx (samtools)
    category: Genomic Operations
    bin: samtools
    description: Index a FASTA file (writes .fai sibling file)
    io:
      inputs:
        - { name: in, types: [FASTA], mode: file }
      outputs:
        - { name: out, types: [FAI], mode: file, flag: -o, filename: "in.txt.fai" }
    parameters:
      - { name: command, type: string, default: faidx, required: true, hidden: true }

  - id: samtools.fastq
    name: Fastq (samtools)
    category: Format Conversion
    bin: samtools
    description: Convert BAM/CRAM alignments to FASTQ
    io:
      inputs:
        - { name: in, types: [BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [FASTQ], mode: stdout }
    parameters:
      - { name: command, type: string, default: fastq, required: true, hidden: true }
      - { name: require_flags, type: integer, flag: -f }
      - { name: exclude_flags, type: integer, flag: -F }
      - { name: tags_to_keep, type: string, flag: -T }
      - { name: append_pair_suffix, type: flag, flag: -N }
      - { name: illumina_format, type: flag, flag: -i }

  - id: samtools.fasta
    name: Fasta (samtools)
    category: Format Conversion
    bin: samtools
    description: Convert BAM/CRAM alignments to FASTA
    io:
      inputs:
        - { name: in, types: [BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [FASTA, Multi-FASTA], mode: stdout }
    parameters:
      - { name: command, type: string, default: fasta, required: true, hidden: true }
      - { name: require_flags, type: integer, flag: -f }
      - { name: exclude_flags, type: integer, flag: -F }
      - { name: tags_to_keep, type: string, flag: -T }

  - id: samtools.flagstat
    name: Flagstat (samtools)
    category: Information and Analysis
    bin: samtools
    description: Per-flag counts (counts of alignments by SAM flag bit)
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: flagstat, required: true, hidden: true }

  - id: samtools.stats
    name: Stats (samtools)
    category: Information and Analysis
    bin: samtools
    description: Comprehensive alignment statistics
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: stats, required: true, hidden: true }
      - { name: bwa_trim_quality, type: integer, flag: -q }
      - { name: insert_size, type: integer, flag: -i }
      - { name: read_length, type: integer, flag: -l }
      - { name: required_flag, type: integer, flag: -f }
      - { name: filtering_flag, type: integer, flag: -F }

  - id: samtools.depth
    name: Depth (samtools)
    category: Information and Analysis
    bin: samtools
    description: Per-position read depth
    io:
      inputs:
        - { name: in, types: [BAM, CRAM], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: depth, required: true, hidden: true }
      - { name: all_positions, type: flag, flag: -a }
      - { name: region, type: string, flag: -r }
      - { name: min_base_qual, type: integer, flag: -q }
      - { name: min_map_qual, type: integer, flag: -Q }

  - id: samtools.merge
    name: Merge (samtools)
    category: Genomic Operations
    bin: samtools
    description: Merge two coordinate-sorted BAM/CRAM files
    io:
      inputs:
        - { name: in1, types: [BAM, CRAM], mode: file }
        - { name: in2, types: [BAM, CRAM], mode: file }
      outputs:
        - { name: out, types: [BAM, CRAM], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: merge, required: true, hidden: true }
      - { name: force, type: flag, flag: -f }
      - { name: name_sorted, type: flag, flag: -n }
      - { name: region, type: string, flag: -R }
      - { name: combine_RG, type: flag, flag: -c }
      - { name: combine_PG, type: flag, flag: -p }
      - { name: compression_level, type: integer, flag: -l }

  - id: samtools.mpileup
    name: Mpileup (samtools)
    category: Information and Analysis
    bin: samtools
    description: Per-position pileup of read bases (text format)
    io:
      inputs:
        - { name: in, types: [BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: -f }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: mpileup, required: true, hidden: true }
      - { name: region, type: string, flag: -r }
      - { name: min_base_qual, type: integer, flag: -Q }
      - { name: min_map_qual, type: integer, flag: -q }
      - { name: max_depth, type: integer, flag: -d }
      - { name: count_anomalous, type: flag, flag: -A }
      - { name: disable_BAQ, type: flag, flag: -B }
      - { name: extended_BAQ, type: flag, flag: -E }
      - { name: output_BP, type: flag, flag: -O }
      - { name: output_MQ, type: flag, flag: -s }
      - { name: output_all, type: flag, flag: -a }

  - id: samtools.markdup
    name: Markdup (samtools)
    category: Genomic Operations
    bin: samtools
    description: Mark or remove PCR/optical duplicates in a coordinate-sorted BAM
    io:
      inputs:
        - { name: in, types: [BAM, CRAM], mode: file }
      outputs:
        - { name: out, types: [BAM, CRAM], flag: "", mode: file }
    parameters:
      - { name: command, type: string, default: markdup, required: true, hidden: true }
      - { name: remove_duplicates, type: flag, flag: -r }
      - { name: enable_stats, type: flag, flag: -s }
      - { name: tag_original, type: flag, flag: -t }
      - { name: optical_distance, type: integer, flag: -d }
      - { name: barcode_tag, type: string, flag: --barcode-tag }

  - id: samtools.coverage
    name: Coverage (samtools)
    category: Information and Analysis
    bin: samtools
    description: Per-reference coverage summary (mean depth, % covered, mapq)
    io:
      inputs:
        - { name: in, types: [BAM, CRAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: coverage, required: true, hidden: true }
      - { name: region, type: string, flag: -r }
      - { name: histogram, type: flag, flag: -m }
      - { name: n_bins, type: integer, flag: -w }
      - { name: min_map_qual, type: integer, flag: -q }
      - { name: min_base_qual, type: integer, flag: -Q }
      - { name: max_depth, type: integer, flag: -d }
      - { name: no_header, type: flag, flag: -H }

  - id: samtools.dict
    name: Dict (samtools)
    category: Format Conversion
    bin: samtools
    description: Build a sequence dictionary text file from a FASTA reference
    io:
      inputs:
        - { name: in, types: [FASTA], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: dict, required: true, hidden: true }
      - { name: assembly, type: string, flag: -a }
      - { name: species, type: string, flag: -s }
      - { name: uri, type: string, flag: -u }
      - { name: alias, type: flag, flag: -A }
      - { name: no_header, type: flag, flag: -H }

  - id: samtools.collate
    name: Collate (samtools)
    category: Genomic Operations
    bin: samtools
    description: Group reads of the same name together (fast, not strictly sorted)
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file, flag: --reference }
      outputs:
        - { name: out, types: [BAM, CRAM, SAM], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: collate, required: true, hidden: true }
      - { name: output_format, type: string, flag: --output-fmt }
      - { name: fast_mode, type: flag, flag: -f }
      - { name: temp_files, type: integer, flag: -n }
      - { name: read_buffer, type: integer, flag: -r }

  - id: samtools.fixmate
    name: Fixmate (samtools)
    category: Genomic Operations
    bin: samtools
    description: Fill in mate coordinates and insert size, and add the MC and ms tags that Markdup requires. Input must be grouped by read name, so run Collate first; coordinate-sorted input is rejected. Sort the result before passing it to Markdup.
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
      outputs:
        - { name: out, types: [BAM, CRAM], flag: "", mode: file }
    parameters:
      - { name: command, type: string, default: fixmate, required: true, hidden: true }
      - { name: mate_score, type: flag, flag: -m, required: true, hidden: true }
      - { name: remove_unmapped, type: flag, flag: -r }
      - { name: disable_proper_pair_check, type: flag, flag: -p }
      - { name: add_ct_tag, type: flag, flag: -c }
      - { name: fix_base_mods, type: flag, flag: -M }
      - { name: output_format, type: string, flag: -O }
      - { name: no_pg, type: flag, flag: --no-PG }

  - id: samtools.idxstats
    name: Idxstats (samtools)
    category: Information and Analysis
    bin: samtools
    description: Report alignment counts per reference sequence as a tab-delimited table of name, length, mapped reads and unmapped reads. Input must be position sorted.
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: idxstats, required: true, hidden: true }

  - id: samtools.consensus
    name: Consensus (samtools)
    category: Genomic Operations
    bin: samtools
    description: Collapse an alignment into a single consensus sequence in FASTA, FASTQ or pileup format. Bayesian mode is the default; the call-fract and het-fract options apply only in simple mode.
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
      outputs:
        - { name: out, types: [FASTA, FASTQ, TEXT], mode: stdout }
    parameters:
      - { name: command, type: string, default: consensus, required: true, hidden: true }
      - { name: format, type: string, flag: -f }
      - { name: mode, type: string, flag: -m }
      - { name: line_length, type: integer, flag: -l }
      - { name: min_depth, type: integer, flag: -d }
      - { name: all_bases, type: flag, flag: -a }
      - { name: ambiguity_codes, type: flag, flag: -A }
      - { name: min_map_qual, type: integer, flag: --min-MQ }
      - { name: min_base_qual, type: integer, flag: --min-BQ }
      - { name: incl_flags, type: string, flag: --rf }
      - { name: excl_flags, type: string, flag: --ff }
      - { name: show_deletions, type: string, flag: --show-del }
      - { name: show_insertions, type: string, flag: --show-ins }
      - { name: mark_insertions, type: flag, flag: --mark-ins }
      - { name: use_quality, type: flag, flag: -q }
      - { name: call_fraction, type: float, flag: -c }
      - { name: het_fraction, type: float, flag: -H }
      - { name: cutoff, type: float, flag: -C }
      - { name: homopoly_fix, type: flag, flag: -p }
      - { name: config, type: string, flag: -X }

  - id: samtools.calmd
    name: Calmd (samtools)
    category: Genomic Operations
    bin: samtools
    description: Recalculate the MD and NM tags against a reference, which several downstream consumers expect. Takes the alignment first and the reference FASTA second. Output is SAM text.
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
        - { name: fasta_ref, types: [FASTA], mode: file }
      outputs:
        - { name: out, types: [SAM], mode: stdout }
    parameters:
      - { name: command, type: string, default: calmd, required: true, hidden: true }
      - { name: identical_as_equals, type: flag, flag: -e }
      - { name: modify_quality, type: flag, flag: -A }
      - { name: compute_BQ, type: flag, flag: -r }
      - { name: extended_BAQ, type: flag, flag: -E }
      - { name: quiet, type: flag, flag: -Q }
      - { name: no_pg, type: flag, flag: --no-PG }

  - id: samtools.ampliconclip
    name: Ampliconclip (samtools)
    category: Genomic Operations
    bin: samtools
    description: Clip amplicon primers from read alignments using a BED file of primer regions. Clipping is soft and on the 5' end by default.
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
        - { name: bed, types: [BED], mode: file, flag: -b }
      outputs:
        - { name: out, types: [BAM, CRAM, SAM], mode: file, flag: -o }
    parameters:
      - { name: command, type: string, default: ampliconclip, required: true, hidden: true }
      - { name: output_format, type: string, flag: -O }
      - { name: soft_clip, type: flag, flag: --soft-clip }
      - { name: hard_clip, type: flag, flag: --hard-clip }
      - { name: both_ends, type: flag, flag: --both-ends }
      - { name: use_strand, type: flag, flag: --strand }
      - { name: clipped_only, type: flag, flag: --clipped }
      - { name: mark_fail, type: flag, flag: --fail }
      - { name: filter_len, type: integer, flag: --filter-len }
      - { name: fail_len, type: integer, flag: --fail-len }
      - { name: unmap_len, type: integer, flag: --unmap-len }
      - { name: no_excluded, type: flag, flag: --no-excluded }
      - { name: original_tag, type: flag, flag: --original }
      - { name: keep_tag, type: flag, flag: --keep-tag }
      - { name: tolerance, type: integer, flag: --tolerance }
      - { name: no_pg, type: flag, flag: --no-PG }

  - id: samtools.head
    name: Head (samtools)
    category: Information and Analysis
    bin: samtools
    description: Print the header and optionally the first few alignment records. Unlike View with header-only, this can show both the header and a record sample in one step.
    io:
      inputs:
        - { name: in, types: [BAM, CRAM, SAM], mode: file }
      outputs:
        - { name: out, types: [SAM], mode: stdout }
    parameters:
      - { name: command, type: string, default: head, required: true, hidden: true }
      - { name: headers, type: integer, flag: -h }
      - { name: records, type: integer, flag: -n }
