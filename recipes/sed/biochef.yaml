apiVersion: v1

id: app.biochef.sed
name: sed
description: GNU stream editor for filtering and transforming text.

version: 4.8-bc.1
homepage: https://www.gnu.org/software/sed/
license:
  spdx: GPL-3.0-or-later
  files: [COPYING]
  evidence_files: [sed/sed.c]
maintainers:
  - name: Biochef

source:
  repo: https://git.savannah.gnu.org/git/sed.git
  tag: "v4.8"
  version: "4.8"
  commit: "62059985637cfafd41d8a8a2a7a63566daf59405"

status: experimental

build:
  wasm:
    strategy: biowasm
    biowasm:
      package: sed

runtime:
  modes: [wasm, remote]

operations:
  - id: sed.script
    name: Script (sed)
    category: Text Processing
    bin: sed
    description: Apply a sed script (substitution, deletion, addressing) to a text stream
    io:
      inputs:
        - { name: in, types: [TEXT, FASTA, FASTQ, Multi-FASTA, NUM, DNA, RNA, AminoAcids], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: regexp_extended, type: flag, flag: -E }
      - { name: quiet, type: flag, flag: -n }
      - { name: separate, type: flag, flag: -s }
      - { name: null_data, type: flag, flag: -z }
      - { name: unbuffered, type: flag, flag: -u }
      - { name: binary, type: flag, flag: -b }
      - { name: line_length, type: integer, flag: -l }
      - { name: script_file, type: string, flag: -f }
      - { name: posix, type: flag, flag: --posix }
      - { name: sandbox, type: flag, flag: --sandbox }
      - { name: debug, type: flag, flag: --debug }
      - { name: follow_symlinks, type: flag, flag: --follow-symlinks }
      - { name: script, type: string, flag: -e, required: true }
