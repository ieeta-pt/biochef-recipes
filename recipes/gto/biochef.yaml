      io:
        inputs: []
        outputs:
          - { name: out, types: [DNA], mode: stdout }
      parameters:
        - { name: seed, type: integer, flag: -s }
        - { name: nSymbols, type: integer, flag: -n }
        - { name: frequency, type: string, flag: -f }

    - id: gto.genomic.period
      name: Genomic Period (GTO)
      bin: gto_genomic_period
      category: Genomic Operations
      description: Calculates the best order depth of a sequence, using FCMs. It only works "ACGT", while the rest will be discarded.
      io:
        inputs:
          - { name: in, types: [DNA], mode: stdin }
        outputs:
          - { name: out, types: [NUM], mode: stdout }
      parameters: []

    - id: gto.genomic.rand.seq.extra.chars
      name: Genomic Rand Seq Extra Chars (GTO)
      bin: gto_genomic_rand_seq_extra_chars
      category: Genomic Operations
      description: Substitutes in the DNA sequence the outside ACGT chars by random ACGT symbols. It works in sequence file formats.
      io:
        inputs:
          - { name: in, types: [DNA], mode: stdin }
        outputs:
          - { name: out, types: [DNA], mode: stdout }
      parameters: []

    - id: gto.genomic.reverse
      name: Genomic Reverse (GTO)
      bin: gto_genomic_reverse
      category: Genomic Operations
      description: Reverses the ACGT bases order for each read in a sequence file.
      io:
        inputs:
          - { name: in, types: [DNA], mode: stdin }
        outputs:
          - { name: out, types: [DNA], mode: stdout }
      parameters: []

    - id: gto.info
      name: Info (GTO)
      bin: gto_info
      category: Information and Analysis
      description: Gives the basic properties of the file, namely size, cardinality, distribution percentage of the symbols, among others.
      io:
        inputs:
          - { name: in, types: [TEXT, Multi-FASTA, FASTA, FASTQ, NUM, DNA, RNA, AminoAcids], mode: stdin}
        outputs:
          - { name: out, types: [TEXT], mode: stdout }
      parameters: []

    - id: gto.lower.bound
      name: Lower Bound (GTO)
      bin: gto_lower_bound
      category: Mathematical Operations
      description: Sets an lower bound in a file with a value per line.
      io:
        inputs:
          - { name: in, types: [NUM], mode: stdin }
        outputs:
          - { name: out, types: [NUM], mode: stdout }
      parameters:
        - { name: lowerbound, type: integer, flag: -l, required: true }

    - id: gto.max
      name: Max (GTO)
      bin: gto_max
      category: Mathematical Operations
      description: Computes the maximum value in each row between two files.
      io:
        inputs:
          - { name: file1, types: [NUM], mode: file }
          - { name: file2, types: [NUM], mode: file }
        outputs:
          - { name: out, types: [NUM], mode: stdout }
      parameters:
        - { name: first_file, type: file, flag: -f, required: true }
        - { name: second_file, type: file, flag: -s, required: true }

    - id: gto.min
      name: Min (GTO)
      bin: gto_min
      category: Mathematical Operations
      description: Computes the minium value in each row between two files.
      io:
        inputs:
          - { name: in, types: [NUM], mode: file }
        outputs:
          - { name: out, types: [NUM], mode: stdout }
      parameters:
        - { name: first_file, type: file, flag: -f, required: true }
        - { name: second_file, type: file, flag: -s, required: true }

    - id: gto.new.line.on.new.x
      name: New Line On New X (GTO)
      bin: gto_new_line_on_new_x
