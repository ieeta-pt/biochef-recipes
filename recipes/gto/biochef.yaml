      description: Extracts sequences from a sequence file, which the range is defined by the user in the parameters.
      io:
        inputs:
          - { name: in, types: [DNA], mode: stdin }
        outputs:
          - { name: out, types: [DNA], mode: stdout }
      parameters:
        - { name: init, type: integer, flag: -i }
        - { name: end, type: integer, flag: -e }

    - id: gto.genomic.gen.random.dna
