      name: Sum (GTO)
      bin: gto_sum
      category: Mathematical Operations
      description: Adds decimal values in file, line by line, splitted by spaces or tabs.
      io:
        inputs:
          - { name: in, types: [NUM], mode: stdin }
        outputs:
          - { name: out, types: [NUM], mode: stdout }
