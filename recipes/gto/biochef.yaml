      io:
        inputs:
          - { name: in, types: [DNA], mode: stdin }
        outputs:
          - { name: out, types: [DNA], mode: stdout }
      parameters:
        - { name: seed, type: integer, flag: -s }
        - { name: mutation-rate, type: float, flag: -m }
        - { name: deletion-rate, type: float, flag: -d }
        - { name: insertion-rate, type: float, flag: -i }

    - id: gto.genomic.extract
      name: Genomic Extract (GTO)
      bin: gto_genomic_extract
