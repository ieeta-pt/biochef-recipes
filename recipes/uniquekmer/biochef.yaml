apiVersion: v1

id: app.biochef.uniquekmer
name: UniqueKMER
description: UniqueKMER — generate per-contig unique k-mer sets from a multi-FASTA. Each genome / contig gets its own k-mer fingerprint suitable for downstream k-mer-based detection or classification. Optionally subtract k-mers that map (within an edit-distance tolerance) to a background reference genome — useful for ensuring the chosen k-mers actually distinguish the target. From the OpenGene group; companion tool to fastv-style pathogen-detection workflows. WASM build is limited to small k (≤12 in practice) because the working hash table allocates 4^k bytes.

version: 0.1.0-bc.1
homepage: https://github.com/OpenGene/UniqueKMER
license:
  spdx: MIT
  files: [LICENSE]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/OpenGene/UniqueKMER
  commit: "8b902e9a82c9ace13d038e684adc06460afeff89"
  version: "0.1.0"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      outputDir: out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    buildsystem: make
    workDir: .
    outputDir: .

runtime:
  modes: [wasm, native]

operations:
  - id: uniquekmer.generate
    name: Generate Unique K-mer Sets
    category: Sequence Analysis
    bin: uniquekmer
    description: Generate per-contig unique k-mer sets from a multi-FASTA input. Output is a directory of per-contig k-mer files. Optionally provide a reference genome (-r) to drop k-mers that also occur in the reference within an edit-distance tolerance, ensuring discriminative k-mers.
    io:
      inputs:
        - { name: fasta, types: [FASTA, Multi-FASTA], mode: file, flag: -f }
        - { name: ref, types: [FASTA, Multi-FASTA], mode: file, flag: -r }
      outputs:
        - { name: outdir, types: [TEXT], mode: file, flag: -o, filename: "unique_kmers" }
    parameters:
      - { name: kmer_length, type: integer, flag: -k, default: 12 }
      - { name: spacing, type: integer, flag: -s, default: 0 }
      - { name: genome_limit, type: integer, flag: -g, default: 0 }
      - { name: edit_distance, type: integer, flag: -e, default: 3 }
