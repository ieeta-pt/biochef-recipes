apiVersion: v1

id: app.biochef.rsem
name: RSEM
description: RSEM's standalone alignment utilities — validate a SAM/BAM for RSEM, compute per-position read depth, keep uniquely mapped reads, and regroup paired-end alignments. The quantification pipeline itself is not included yet, because it works on a reference split across several files. WASM build links against the vendored htslib (compression deps disabled; threading neutered) and runs single-threaded.

version: 1.3.3-bc.1
homepage: https://github.com/deweylab/RSEM
license:
  spdx: GPL-3.0-or-later
  files: [COPYING]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/deweylab/RSEM
  commit: "e2df2d3aafd4f0c982182e97c9cb2193647178ca"
  version: "1.3.3"

status: experimental

build:
  wasm:
    strategy: emscripten
    emscripten:
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh

runtime:
  modes: [wasm, remote]

# Only the RSEM tools that work on their own input files are here.
#
# rsem-extract-reference-transcripts, -synthesis-reference-transcripts, -preref,
# -parse-alignments, -run-em, -run-gibbs, -calculate-credibility-intervals,
# -tbam2gbam, -simulate-reads and -build-read-index read and write an RSEM
# reference stored as several files sharing a prefix (ref.ti, ref.seq, ref.grp,
# ref.idx.fa, ...) and pass only the prefix on the command line. Recipes cannot
# describe that yet (ieeta-pt/biochef-hub#46).
#
# rsem-bam2wig takes its track name after the output file
# (<bam> <out.wig> <name>), and parameters are always placed before inputs and
# outputs, so it cannot be invoked correctly either.
#
# The tools' own usage is in each source file's main() at the pinned commit.

operations:
  - id: rsem.sam.validator
    name: SAM Validator (RSEM)
    category: Sequence Analysis
    bin: rsem-sam-validator
    description: Check that a SAM/BAM meets RSEM's assumptions — no mix of single-end and paired-end reads, mates adjacent, and every alignment of a read grouped together. Prints whether the file is valid.
    io:
      inputs:
        - { name: in, types: [SAM, BAM], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters: []

  - id: rsem.bam2readdepth
    name: BAM to Read Depth (RSEM)
    category: Sequence Analysis
    bin: rsem-bam2readdepth
    description: Per-position read depth of every reference sequence, one line per sequence. The input must be sorted by coordinate.
    io:
      inputs:
        - { name: bam, types: [BAM, SAM], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: file, flag: "", filename: "readdepth.txt" }
    parameters: []

  - id: rsem.get.unique
    name: Get Unique Alignments (RSEM)
    category: Sequence Analysis
    bin: rsem-get-unique
    description: Keep only the reads that have a single alignment. The alignments of each read must be adjacent, as an aligner writes them (not sorted by coordinate).
    io:
      inputs:
        - { name: bam, types: [BAM, SAM], mode: file }
      outputs:
        - { name: out, types: [BAM], mode: file, flag: "", filename: "unique.bam" }
    parameters:
      # The first positional argument is the thread count; WASM runs single-threaded.
      - { name: threads, type: integer, default: 1, required: true, hidden: true }

  - id: rsem.scan.paired.end
    name: Scan For Paired-End Reads (RSEM)
    category: Sequence Analysis
    bin: rsem-scan-for-paired-end-reads
    description: Regroup the alignments of each paired-end read so that both mates of every alignment are adjacent, the layout RSEM expects. Single-end reads pass through unchanged. The alignments of each read must be adjacent, as an aligner writes them.
    io:
      inputs:
        - { name: in, types: [SAM, BAM], mode: file }
      outputs:
        - { name: out, types: [BAM], mode: file, flag: "", filename: "paired.bam" }
    parameters:
      # The first positional argument is the thread count; WASM runs single-threaded.
      - { name: threads, type: integer, default: 1, required: true, hidden: true }
