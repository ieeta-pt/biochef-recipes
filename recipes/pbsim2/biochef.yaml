apiVersion: v1

id: app.biochef.pbsim2
name: PBSIM2
description: "PBSIM2 simulates long reads, from PacBio or Oxford Nanopore sequencers, from a reference: it draws each read's length and accuracy, gives it quality scores from a hidden Markov model trained on real reads (P4C2, P5C3 and P6C4 for PacBio, R94, R95 and R103 for Nanopore), or from the reads of a sample FASTQ, and puts substitutions, insertions and deletions where the qualities are low. Each read comes with its alignment to the reference, in MAF."

version: 2.0.1-bc.1
homepage: https://github.com/yukiteruono/pbsim2
license:
  spdx: GPL-2.0-or-later
  files: [COPYING]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/yukiteruono/pbsim2
  commit: "eeb5a19420534a0f672c81db2670117e62a9ee38"
  version: "2.0.1"

status: experimental

build:
  wasm:
    strategy: emscripten
    patches: [patches/entry-point.patch, patches/seeded-rand.patch, patches/exit-status.patch, patches/sampling-interval-at-least-one.patch, patches/insertion-quality-bounds.patch]
    emscripten:
      outputDir: out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh
  native:
    outputDir: out
    buildScript: build-native.sh
    patches: [patches/entry-point.patch, patches/seeded-rand.patch, patches/exit-status.patch, patches/sampling-interval-at-least-one.patch, patches/insertion-quality-bounds.patch, patches/native-musl-libm.patch]
    buildTools: [make, gcc]

runtime:
  modes: [wasm, native, remote]

operations:
  - id: pbsim2.simulate
    name: Simulate Long Reads (PBSIM2)
    category: Read Simulation
    bin: pbsim
    description: "Simulate long reads from each sequence of a reference, to the depth given, with the quality model of a sequencer: P4C2, P5C3 or P6C4 for PacBio, R94, R95 or R103 for Oxford Nanopore. Writes the reads in FASTQ and their alignments to the reference in MAF."
    io:
      inputs:
        - &reference { name: reference, types: [Multi-FASTA, FASTA], mode: file }
      outputs:
        - &reads { name: reads, types: [FASTQ], mode: file, flag: --bc-fastq, filename: reads.fastq }
        - &alignments { name: alignments, types: [MAF], mode: file, flag: --bc-maf, filename: reads.maf }
    parameters:
      - &model { name: model, type: string, flag: --bc-model, default: R94, required: true }
      - &depth { name: depth, type: float, flag: --depth, default: 20 }
      - { name: length_mean, type: float, flag: --length-mean, default: 9000 }
      - { name: length_sd, type: float, flag: --length-sd, default: 7000 }
      - &length_min { name: length_min, type: integer, flag: --length-min, default: 100 }
      - &length_max { name: length_max, type: integer, flag: --length-max, default: 1000000 }
      - &accuracy_mean { name: accuracy_mean, type: float, flag: --accuracy-mean, default: 0.85 }
      - &difference_ratio { name: difference_ratio, type: string, flag: --difference-ratio, default: "6:54:40" }
      - &seed { name: seed, type: integer, flag: --seed, default: 1 }
      - &id_prefix { name: id_prefix, type: string, flag: --id-prefix, default: S }

  - id: pbsim2.sample
    name: Simulate Long Reads from a Sample (PBSIM2)
    category: Read Simulation
    bin: pbsim
    description: "Simulate long reads from each sequence of a reference, to the depth given, with the lengths and quality scores of reads drawn from a sample of real reads in FASTQ. The sample's reads outside the length and accuracy ranges given are left out. Writes the reads in FASTQ and their alignments to the reference in MAF."
    io:
      inputs:
        - *reference
        - { name: sample, types: [LONG_READS, FASTQ], mode: file, flag: --sample-fastq }
      outputs:
        - *reads
        - *alignments
    parameters:
      - *depth
      - *length_min
      - *length_max
      - { name: accuracy_min, type: float, flag: --accuracy-min, default: 0.75 }
      - { name: accuracy_max, type: float, flag: --accuracy-max, default: 1 }
      - *difference_ratio
      - *seed
      - *id_prefix

  - id: pbsim2.templates
    name: Simulate Reads of Templates (PBSIM2)
    category: Read Simulation
    bin: pbsim
    description: "Simulate one read of each template sequence, from end to end, with the quality model of a sequencer, as for full-length transcripts or amplicons. Writes the reads in FASTQ and their alignments to the templates in MAF."
    io:
      inputs:
        - { name: templates, types: [Multi-FASTA, FASTA], mode: file, flag: --template-fasta }
      outputs:
        - *reads
        - *alignments
    parameters:
      - *model
      - *accuracy_mean
      - *length_max
      - *difference_ratio
      - *seed
      - *id_prefix
