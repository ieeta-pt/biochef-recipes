apiVersion: v1

id: app.biochef.newick-utils
name: newick-utils
description: Command-line tools for manipulating phylogenetic trees in Newick format. Reroot, prune, extract clades, strip branch lengths, measure distances, and render trees as ASCII art or SVG.

version: 1.6-bc.1
homepage: https://github.com/tjunier/newick_utils
license:
  spdx: BSD-3-Clause
  files: [COPYING]
maintainers:
  - name: Biochef

source:
  repo: https://github.com/tjunier/newick_utils
  commit: "da121155a977197cab9fbb15953ca1b40b11eb87"
  version: "1.6"

status: experimental

build:
  wasm:
    strategy: emscripten
    patches:
      - patches/tentative-definitions.patch
      - patches/return-type-declarations.patch
      - patches/condense-group-size.patch
      - patches/prune-readline.patch
      - patches/biochef-entry-point.patch
    emscripten:
      outputDir: out
      emscriptenVersion: 4.0.18
      buildScript: build-wasm.sh

runtime:
  modes: [wasm, remote]

operations:
  - id: newickutils.display.svg
    name: Draw Tree as SVG (newick-utils)
    category: Information and Analysis
    bin: nw_display
    description: Render phylogenetic trees as a scalable SVG image, either as a rectangular cladogram or as a radial tree.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [SVG], mode: stdout }
    parameters:
      - { name: svg, type: flag, flag: -s, required: true, hidden: true }
      - { name: radial, type: flag, flag: -r }
      - { name: width, type: integer, flag: -w }
      - { name: leaf_spacing, type: integer, flag: -v }
      - { name: branch_label_style, type: string, flag: -b }
      - { name: leaf_label_style, type: string, flag: -l }
      - { name: inner_label_style, type: string, flag: -i }
      - { name: node_style, type: string, flag: -d }
      - { name: inner_label_position, type: string, flag: -I }
      - { name: label_offset, type: integer, flag: -n }
      - { name: label_char_width, type: float, flag: -W }
      - { name: suppress_scale_bar, type: flag, flag: -S }
      - { name: scale_unit, type: string, flag: -u }
      - { name: label_rotation, type: float, flag: -a }
      - { name: left_label_rotation, type: float, flag: -A }
      - { name: root_length, type: integer, flag: -R }
      - { name: depth_zero, type: flag, flag: -t }

  - id: newickutils.display
    name: Draw Tree as Text (newick-utils)
    category: Information and Analysis
    bin: nw_display
    description: Render phylogenetic trees as ASCII art, with a scale bar for trees with branch lengths.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: width, type: integer, flag: -w }
      - { name: graph_style, type: string, flag: -e }
      - { name: inner_label_position, type: string, flag: -I }
      - { name: root_length, type: integer, flag: -R }
      - { name: suppress_scale_bar, type: flag, flag: -S }
      - { name: scale_unit, type: string, flag: -u }
      - { name: depth_zero, type: flag, flag: -t }

  - id: newickutils.reroot
    name: Reroot (newick-utils)
    category: Genomic Operations
    bin: nw_reroot
    description: Reroot trees on the outgroup formed by the labels in the outgroup list (one per line), or, without one, on the longest branch. With deroot, remove the root instead.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
        - { name: outgroup, types: [LIST], mode: file, flag: --bc-labels }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: deroot, type: flag, flag: -d }
      - { name: lax, type: flag, flag: -l }
      - { name: inner_labels_are_support, type: flag, flag: -s }

  - id: newickutils.prune
    name: Prune (newick-utils)
    category: Genomic Operations
    bin: nw_prune
    description: Remove the nodes whose labels are in the label list (one per line), or with reverse keep only those nodes.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
        - { name: labels, types: [LIST], mode: file, flag: --bc-labels }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: reverse, type: flag, flag: -v }

  - id: newickutils.topology
    name: Topology (newick-utils)
    category: Genomic Operations
    bin: nw_topology
    description: Strip branch lengths to leave the tree topology alone, optionally discarding labels as well.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: keep_branch_lengths, type: flag, flag: -b }
      - { name: discard_inner_labels, type: flag, flag: -I }
      - { name: discard_leaf_labels, type: flag, flag: -L }

  - id: newickutils.clade
    name: Extract Clade (newick-utils)
    category: Genomic Operations
    bin: nw_clade
    description: Extract the smallest clade containing all the labels in the label list (one per line).
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
        - { name: labels, types: [LIST], mode: file, flag: --bc-labels }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: context_levels, type: integer, flag: -c }
      - { name: monophyletic_only, type: flag, flag: -m }
      - { name: siblings, type: flag, flag: -s }

  - id: newickutils.clade.regexp
    name: Extract Clade by Pattern (newick-utils)
    category: Genomic Operations
    bin: nw_clade
    description: Extract the smallest clade containing all the labels that match a pattern, a basic POSIX regular expression (as in grep, so alternation is written \|).
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: regexp_mode, type: flag, flag: -r, required: true, hidden: true }
      - { name: pattern, type: string, flag: --bc-last, required: true }
      - { name: context_levels, type: integer, flag: -c }
      - { name: monophyletic_only, type: flag, flag: -m }
      - { name: siblings, type: flag, flag: -s }

  - id: newickutils.labels
    name: List Labels (newick-utils)
    category: Information and Analysis
    bin: nw_labels
    description: List the node labels of trees, one per line or, with tab_separated, on one line.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [LIST], mode: stdout }
    parameters:
      - { name: no_inner_labels, type: flag, flag: -I }
      - { name: no_leaf_labels, type: flag, flag: -L }
      - { name: root_only, type: flag, flag: -r }
      - { name: tab_separated, type: flag, flag: -t }

  - id: newickutils.distance
    name: Distances (newick-utils)
    category: Information and Analysis
    bin: nw_distance
    description: Report distances between nodes, as a list or as a matrix, measured from the root, the parent, or the last common ancestor. With a label list (one per line), only between those nodes.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
        - { name: labels, types: [LIST], mode: file, flag: --bc-labels }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: mode, type: string, flag: -m }
      - { name: selection, type: string, flag: -s }
      - { name: show_labels, type: flag, flag: -n }
      - { name: triangular, type: flag, flag: -t }

  - id: newickutils.stats
    name: Tree Statistics (newick-utils)
    category: Information and Analysis
    bin: nw_stats
    description: Report summary statistics for trees, including node and leaf counts and whether each is a cladogram or a phylogram.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [TEXT], mode: stdout }
    parameters:
      - { name: format, type: string, flag: -f }

  - id: newickutils.order
    name: Order (newick-utils)
    category: Genomic Operations
    bin: nw_order
    description: Order the children of each node by a chosen criterion, which makes two trees with the same topology directly comparable.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: criterion, type: string, flag: -c }
      - { name: reverse, type: flag, flag: -r }

  - id: newickutils.indent
    name: Indent (newick-utils)
    category: Format Conversion
    bin: nw_indent
    description: Reformat trees across multiple indented lines so they can be read, or with compact collapse them back onto one line.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: compact, type: flag, flag: -c }
      - { name: indent_text, type: string, flag: -t }

  - id: newickutils.condense
    name: Condense (newick-utils)
    category: Genomic Operations
    bin: nw_condense
    description: Collapse clades whose leaves all share a label into a single leaf. With a group map (a label and a group per line), collapse the clades whose leaves all belong to one group into a leaf named group_sample_size.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
        - { name: group_map, types: [TEXT], mode: file, flag: -m }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: unicify_labels, type: flag, flag: -u }

  - id: newickutils.trim
    name: Trim (newick-utils)
    category: Genomic Operations
    bin: nw_trim
    description: Cut trees at a maximum depth, measured as a distance from the root or, with depth_in_ancestors, as a number of ancestors.
    io:
      inputs:
        - { name: in, types: [NEWICK], mode: file }
      outputs:
        - { name: out, types: [NEWICK], mode: stdout }
    parameters:
      - { name: max_depth, type: float, flag: --bc-last, required: true, default: 1 }
      - { name: depth_in_ancestors, type: flag, flag: -a }
